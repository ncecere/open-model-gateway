# Pinned to match the Dockerfile's build stage (mirror.gcr.io/library/rust:1.99.1-bookworm,
# pinned by digest) so CI, local gates and release builds compile with the same rustc (#354).
# `rustup` reads this automatically for every `cargo`/`rustc` invocation under this directory
# tree and installs the toolchain on first use if it is missing.
#
# Bumping this version is a single reviewed PR: read the release notes, fix any new lints,
# then run the full local gates (see docs/verification.md) before merging. CI (ci.yml), the
# Dockerfile and this file must change together; tests/supply-chain.test.mjs fails the build
# if they disagree or if any of them floats on `stable`/`beta`/`nightly`.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
