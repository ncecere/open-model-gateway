# Generated by tests/supply-chain/update-pinned-jobs.mjs; checked by
# tests/supply-chain/pinned-jobs.test.mjs (#488). Every job that builds, publishes, signs,
# attests, imports or tests an image, exactly as its workflow defines it, the top-level
# keys of each workflow that holds one, and the local actions those jobs use. A change to one of these jobs fails the test until
# this file is regenerated, so the change shows here in review. Read it as the diff of what
# runs next to the image under test, not as generated noise.
workflows:
  .github/workflows/image.yml:
    name: image
    on:
      workflow_call:
        outputs:
          digest:
            description: The published multi-arch index digest (sha256:...)
            value: ${{ jobs.publish.outputs.digest }}
      workflow_dispatch:
        inputs:
          acceptance_probe:
            description: Sign and verify only this non-main branch's existing dev index (no normal publication)
            type: boolean
            required: false
            default: false
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/ncecere/open-model-gateway
  .github/workflows/branch-images.yml:
    name: branch-images
    on:
      push:
        branches:
          - "**"
      workflow_dispatch:
        inputs:
          ref:
            description: Branch, tag or commit to build (default is the selected ref)
            required: false
            type: string
    permissions:
      contents: read
    concurrency:
      group: branch-images-${{ github.ref }}
      cancel-in-progress: true
  .github/workflows/loadtest-image.yml:
    name: loadtest-image
    on:
      workflow_dispatch:
        inputs:
          ref:
            description: Branch, tag or commit to build (default is the selected ref)
            required: false
            type: string
    permissions:
      contents: read
    concurrency:
      group: loadtest-image-${{ inputs.ref || github.ref }}
      cancel-in-progress: true
  .github/workflows/oci-import.yml:
    name: oci-import
    on:
      workflow_call:
        inputs:
          artifact_id:
            required: true
            type: string
          root_digest:
            required: true
            type: string
          platform:
            required: true
            type: string
          image_repository:
            required: true
            type: string
          source_revision:
            required: true
            type: string
        outputs:
          digest:
            description: Exact staged OCI root digest
            value: ${{ jobs.import.outputs.digest }}
          digest_linux_amd64:
            description: Staged root when platform is linux/amd64
            value: ${{ jobs.import.outputs.digest_linux_amd64 }}
          digest_linux_arm64:
            description: Staged root when platform is linux/arm64
            value: ${{ jobs.import.outputs.digest_linux_arm64 }}
    permissions:
      contents: read
  .github/workflows/prune-dev-images.yml:
    name: prune-dev-images
    on:
      schedule:
        - cron: 17 4 * * 1
      workflow_dispatch:
        inputs:
          older_than_days:
            description: Delete development images older than this many days
            required: false
            default: "14"
            type: string
          dry_run:
            description: Only list what would be deleted
            required: false
            default: true
            type: boolean
    permissions:
      contents: read
    concurrency:
      group: prune-dev-images
      cancel-in-progress: false
  .github/workflows/ci.yml:
    name: CI
    on:
      push:
        branches:
          - main
        tags:
          - v*
      pull_request: null
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
local_actions:
  .github/actions/setup-node/action.yml:
    name: Set up Node.js (pinned, checksum-verified)
    description: Installs Node.js 22.23.3 from nodejs.org after a SHA-256 check
    runs:
      using: composite
      steps:
        - name: Install Node.js
          shell: bash
          run: |
            set -euo pipefail
            # The URL and checksum must be literals: .github/scripts/fetch-verified.sh,
            # run from the checked-out repository, is the only download path
            # (tests/supply-chain.test.mjs).
            case "${RUNNER_ARCH}" in
              X64)
                bash .github/scripts/fetch-verified.sh https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de "${RUNNER_TEMP}/node.tar.xz"
                ;;
              ARM64)
                bash .github/scripts/fetch-verified.sh https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-arm64.tar.xz a44aeb94849a299b22df10b9e622ec2f605c2183501bc40590705131de7c740f "${RUNNER_TEMP}/node.tar.xz"
                ;;
              *)
                echo "::error::unsupported runner architecture ${RUNNER_ARCH}"
                exit 1
                ;;
            esac
            mkdir -p "${RUNNER_TEMP}/node"
            tar -xJf "${RUNNER_TEMP}/node.tar.xz" --strip-components=1 -C "${RUNNER_TEMP}/node"
            "${RUNNER_TEMP}/node/bin/node" --version
            echo "${RUNNER_TEMP}/node/bin" >> "$GITHUB_PATH"
jobs:
  - file: .github/workflows/image.yml
    job: probe-prepare
    definition:
      if: github.event_name == 'workflow_dispatch' && inputs.acceptance_probe == true
      runs-on: ubuntu-24.04
      timeout-minutes: 10
      permissions:
        contents: read
        packages: read
      env:
        EVENT: ${{ github.event_name }}
        PROBE: ${{ inputs.acceptance_probe }}
        REF_TYPE: ${{ github.ref_type }}
      outputs:
        digest: ${{ steps.resolve.outputs.digest }}
        child: ${{ steps.resolve.outputs.child }}
      steps:
        - name: Refuse anything except this branch's explicit probe
          run: |
            set -euo pipefail
            [[ "${EVENT}" = workflow_dispatch && "${PROBE}" = true ]]
            [[ "${GITHUB_REPOSITORY}" = ncecere/open-model-gateway && "${IMAGE}" = ghcr.io/ncecere/open-model-gateway ]]
            [[ "${REF_TYPE}" = branch && "${GITHUB_REF}" = refs/heads/?* && "${GITHUB_REF}" != refs/heads/main ]]
            [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ && "${GITHUB_WORKFLOW_SHA}" = "${GITHUB_SHA}" ]]
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            ref: ${{ github.workflow_sha }}
            persist-credentials: false
        - name: Authenticate privately with native Docker
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            set -euo pipefail
            umask 077
            export DOCKER_CONFIG
            DOCKER_CONFIG=$(mktemp -d "${RUNNER_TEMP}/probe-auth.XXXXXXXX")
            echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "$GITHUB_ENV"
            printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        - name: Resolve and pull the existing dev index (no retry or rebuild)
          id: resolve
          run: |
            set -euo pipefail
            tag="${IMAGE}:dev-${GITHUB_SHA:0:12}"
            manifest=$(docker buildx imagetools inspect "${tag}" --format '{{json .Manifest}}') || { echo '::error::dev tag not ready; require the completed branch image workflow'; exit 1; }
            digest=$(jq -er '.digest | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' <<<"${manifest}")
            child=$(docker buildx imagetools inspect --raw "${IMAGE}@${digest}" | jq -er '
              select(.schemaVersion == 2 and .mediaType == "application/vnd.oci.image.index.v1+json") | .manifests |
              select(type == "array" and length > 0) |
              select(all(.[]; .mediaType == "application/vnd.oci.image.manifest.v1+json" and
                (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
                (.size | type == "number" and . > 0 and floor == .))) |
              [.[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] as $native |
              select(($native | length) == 1) | $native[0].digest as $child |
              select(all(.[]; (.platform.os == "linux" and .platform.architecture == "amd64") or
                (.platform.os == "unknown" and .platform.architecture == "unknown" and
                 .annotations["vnd.docker.reference.type"] == "attestation-manifest" and
                 .annotations["vnd.docker.reference.digest"] == $child))) | $child')
            [[ "${child}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [ "${child}" != "${digest}" ]
            docker pull --platform linux/amd64 "${IMAGE}@${child}"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "child=${child}" >> "$GITHUB_OUTPUT"
        - name: Remove probe credentials
          if: always()
          run: |
            if [ -n "${DOCKER_CONFIG:-}" ] && [ -d "${DOCKER_CONFIG}" ]; then
              trap 'rm -rf -- "${DOCKER_CONFIG}"' EXIT
              docker logout ghcr.io
            fi
        - name: Check exact revision, native platform and Cargo version without credentials
          env:
            CHILD: ${{ steps.resolve.outputs.child }}
          run: |
            set -euo pipefail
            [ ! -d "${DOCKER_CONFIG}" ]
            docker image inspect "${IMAGE}@${CHILD}" | jq -e --arg revision "${GITHUB_SHA}" '
              type == "array" and length == 1 and .[0].Os == "linux" and .[0].Architecture == "amd64" and
              .[0].Config.Labels["org.opencontainers.image.revision"] == $revision' >/dev/null
            want=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' apps/gateway/Cargo.toml | head -n1)
            [ -n "${want}" ]
            got=$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges "${IMAGE}@${CHILD}" --version)
            [ "${got}" = "open-model-gateway ${want}" ]
  - file: .github/workflows/image.yml
    job: probe-sign
    definition:
      if: github.event_name == 'workflow_dispatch' && inputs.acceptance_probe == true
      needs:
        - probe-prepare
      runs-on: ubuntu-24.04
      timeout-minutes: 10
      permissions:
        contents: read
        packages: write
        id-token: write
      env:
        EVENT: ${{ github.event_name }}
        PROBE: ${{ inputs.acceptance_probe }}
        REF_TYPE: ${{ github.ref_type }}
        DIGEST: ${{ needs.probe-prepare.outputs.digest }}
        CHILD: ${{ needs.probe-prepare.outputs.child }}
      steps:
        - name: Refuse anything except this branch's explicit probe
          run: |
            set -euo pipefail
            [[ "${EVENT}" = workflow_dispatch && "${PROBE}" = true ]]
            [[ "${GITHUB_REPOSITORY}" = ncecere/open-model-gateway && "${IMAGE}" = ghcr.io/ncecere/open-model-gateway ]]
            [[ "${REF_TYPE}" = branch && "${GITHUB_REF}" = refs/heads/?* && "${GITHUB_REF}" != refs/heads/main ]]
            [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ && "${GITHUB_WORKFLOW_SHA}" = "${GITHUB_SHA}" ]]
            [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ && "${CHILD}" =~ ^sha256:[0-9a-f]{64}$ && "${CHILD}" != "${DIGEST}" ]]
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            ref: ${{ github.workflow_sha }}
            persist-credentials: false
        - name: Install cosign (pinned release, SHA-256 verified)
          run: |
            set -euo pipefail
            mkdir -p "${RUNNER_TEMP}/cosign-bin"
            bash .github/scripts/fetch-verified.sh https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa "${RUNNER_TEMP}/cosign-bin/cosign"
            chmod 0755 "${RUNNER_TEMP}/cosign-bin/cosign"
            echo "${RUNNER_TEMP}/cosign-bin" >> "$GITHUB_PATH"
        - name: Authenticate privately with native Docker
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            set -euo pipefail
            umask 077
            export DOCKER_CONFIG
            DOCKER_CONFIG=$(mktemp -d "${RUNNER_TEMP}/probe-auth.XXXXXXXX")
            echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "$GITHUB_ENV"
            printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        - name: Sign only the prepared index
          run: |
            set -euo pipefail
            cosign sign --yes "${IMAGE}@${DIGEST}"
        - name: Remove probe credentials
          if: always()
          run: |
            if [ -n "${DOCKER_CONFIG:-}" ] && [ -d "${DOCKER_CONFIG}" ]; then
              trap 'rm -rf -- "${DOCKER_CONFIG}"' EXIT
              docker logout ghcr.io
            fi
  - file: .github/workflows/image.yml
    job: probe-verify
    definition:
      if: github.event_name == 'workflow_dispatch' && inputs.acceptance_probe == true
      needs:
        - probe-prepare
        - probe-sign
      runs-on: ubuntu-24.04
      timeout-minutes: 10
      permissions:
        contents: read
        packages: read
      env:
        EVENT: ${{ github.event_name }}
        PROBE: ${{ inputs.acceptance_probe }}
        REF_TYPE: ${{ github.ref_type }}
        DIGEST: ${{ needs.probe-prepare.outputs.digest }}
        CHILD: ${{ needs.probe-prepare.outputs.child }}
      steps:
        - name: Refuse anything except this branch's explicit probe
          run: |
            set -euo pipefail
            [[ "${EVENT}" = workflow_dispatch && "${PROBE}" = true ]]
            [[ "${GITHUB_REPOSITORY}" = ncecere/open-model-gateway && "${IMAGE}" = ghcr.io/ncecere/open-model-gateway ]]
            [[ "${REF_TYPE}" = branch && "${GITHUB_REF}" = refs/heads/?* && "${GITHUB_REF}" != refs/heads/main ]]
            [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ && "${GITHUB_WORKFLOW_SHA}" = "${GITHUB_SHA}" ]]
            [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ && "${CHILD}" =~ ^sha256:[0-9a-f]{64}$ && "${CHILD}" != "${DIGEST}" ]]
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            ref: ${{ github.workflow_sha }}
            persist-credentials: false
        - name: Install cosign (pinned release, SHA-256 verified)
          run: |
            set -euo pipefail
            mkdir -p "${RUNNER_TEMP}/cosign-bin"
            bash .github/scripts/fetch-verified.sh https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa "${RUNNER_TEMP}/cosign-bin/cosign"
            chmod 0755 "${RUNNER_TEMP}/cosign-bin/cosign"
            echo "${RUNNER_TEMP}/cosign-bin" >> "$GITHUB_PATH"
        - name: Authenticate privately with native Docker
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            set -euo pipefail
            umask 077
            export DOCKER_CONFIG
            DOCKER_CONFIG=$(mktemp -d "${RUNNER_TEMP}/probe-auth.XXXXXXXX")
            echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "$GITHUB_ENV"
            printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        - name: Verify exact root and expected refusals
          run: |
            set -euo pipefail
            umask 077
            data=$(mktemp -d "${RUNNER_TEMP}/probe-bundles.XXXXXXXX")
            trap 'rm -rf -- "${data}"' EXIT
            identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/image.yml@${GITHUB_REF}"
            issuer=https://token.actions.githubusercontent.com
            # Online verification still proves registry association with this root.
            cosign verify --certificate-identity "${identity}" --certificate-oidc-issuer "${issuer}" "${IMAGE}@${DIGEST}" > "${data}/root.json"
            jq -e --arg digest "${DIGEST}" 'type == "array" and length > 0 and all(.[];
              .critical.image["docker-manifest-digest"] == $digest)' "${data}/root.json" >/dev/null
            # Download once; cap the private file at 1 MiB and reject ANY extra byte.
            cosign download signature "${IMAGE}@${DIGEST}" | {
              head -c 1048576 > "${data}/signatures.jsonl"
              [ "$(head -c 1 | wc -c)" -eq 0 ]
            }
            [ -s "${data}/signatures.jsonl" ]
            # Cosign 3.1.4's default is v0.3 DSSE. Download can fall back to legacy;
            # reject that format (or empty/malformed data), never infer absence.
            jq -ces 'if length >= 1 and length <= 16 and all(.[];
              type == "object" and .mediaType == "application/vnd.dev.sigstore.bundle.v0.3+json" and
              (.dsseEnvelope | type == "object")) then .[] else error("invalid root bundles") end' \
              "${data}/signatures.jsonl" > "${data}/bundles.jsonl"
            refuse() {
              local output line seen=0 expected="$4"
              if output=$(cosign verify-blob --bundle ./bundle.json --certificate-identity "$2" --certificate-oidc-issuer "$3" "$1" 2>&1); then
                echo '::error::unexpected successful negative verification'; return 1
              fi
              # Local VerifyNewBundle errors have no registry-discovery wrapper.
              # Cobra/main may duplicate the leaf; every line must be that reason.
              while IFS= read -r line; do
                case "${line}" in
                  'Error: '*) line="${line#Error: }" ;;
                  'error during command execution: '*) line="${line#error during command execution: }" ;;
                  *)
                    if [[ "${line}" =~ ^[0-9]{4}/[0-9]{2}/[0-9]{2}\ [0-9]{2}:[0-9]{2}:[0-9]{2}\ error\ during\ command\ execution:\ (.*)$ ]]; then
                      line="${BASH_REMATCH[1]}"
                    fi
                    ;;
                esac
                [ "${line}" = "${expected}" ] || return 1
                seen=$((seen + 1))
              done <<<"${output}"
              [ "${seen}" -gt 0 ]
            }
            policy='failed to verify certificate identity: no matching CertificateIdentity found, last error:'
            printf -v subject_failure '%s expected SAN value "%s", got "%s"' "${policy}" "${identity/image.yml/wrong-workflow.yml}" "${identity}"
            printf -v issuer_failure '%s expected issuer value "%s", got "%s"' "${policy}" https://wrong-issuer.invalid "${issuer}"
            while IFS= read -r bundle; do
              work=$(mktemp -d "${data}/bundle.XXXXXXXX")
              (
                # payloadBytes tries a file before payloadDigest: start EMPTY so
                # no pseudo-digest filename can shadow WithArtifactDigest.
                cd "${work}"
                printf '%s\n' "${bundle}" > bundle.json
                [ "$(wc -c < bundle.json)" -le 1048576 ]
                cosign verify-blob --bundle ./bundle.json --certificate-identity "${identity}" --certificate-oidc-issuer "${issuer}" "${DIGEST}"
                refuse "${DIGEST}" "${identity/image.yml/wrong-workflow.yml}" "${issuer}" "${subject_failure}"
                refuse "${DIGEST}" "${identity}" https://wrong-issuer.invalid "${issuer_failure}"
                # Same verified root bundle, different artifact: actual binding proof.
                refuse "${CHILD}" "${identity}" "${issuer}" 'failed to verify signature: provided artifact digest does not match any digest in statement'
              )
            done < "${data}/bundles.jsonl"
        - name: Remove probe credentials
          if: always()
          run: |
            if [ -n "${DOCKER_CONFIG:-}" ] && [ -d "${DOCKER_CONFIG}" ]; then
              trap 'rm -rf -- "${DOCKER_CONFIG}"' EXIT
              docker logout ghcr.io
            fi
  - file: .github/workflows/image.yml
    job: meta
    definition:
      if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && !(github.event_name == 'workflow_dispatch' && inputs.acceptance_probe == true)
      runs-on: ubuntu-24.04
      timeout-minutes: 5
      permissions:
        contents: read
      outputs:
        build_labels: ${{ steps.build.outputs.labels }}
        tags: ${{ steps.publish.outputs.tags }}
        annotations: ${{ steps.publish.outputs.annotations }}
      steps:
        - name: Labels of the per-architecture images
          id: build
          uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
          with:
            images: ${{ env.IMAGE }}
            labels: |
              org.opencontainers.image.title=open-model-gateway
              org.opencontainers.image.revision=${{ github.sha }}
              org.opencontainers.image.licenses=MIT
        - name: Tags and annotations of the multi-arch index
          id: publish
          uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
          env:
            DOCKER_METADATA_ANNOTATIONS_LEVELS: index
          with:
            images: ${{ env.IMAGE }}
            flavor: |
              latest=false
            tags: |
              type=sha,prefix=sha-,format=short,enable=${{ github.ref_type == 'branch' }}
              type=raw,value=${{ github.ref_name }},priority=1000,enable=${{ github.ref_type == 'tag' }}
              type=match,pattern=^(v\d+\.\d+)\.\d+$,group=1,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
              type=raw,value=latest-release,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            labels: |
              org.opencontainers.image.title=open-model-gateway
              org.opencontainers.image.licenses=MIT
  - file: .github/workflows/image.yml
    job: build
    definition:
      name: build (${{ matrix.platform }})
      needs:
        - meta
      strategy:
        fail-fast: true
        matrix:
          include:
            - platform: linux/amd64
              pair: linux-amd64
              runner: ubuntu-24.04
            - platform: linux/arm64
              pair: linux-arm64
              runner: ubuntu-24.04-arm
      runs-on: ${{ matrix.runner }}
      timeout-minutes: 75
      permissions:
        contents: read
      outputs:
        digest_linux_amd64: ${{ steps.record.outputs.digest_linux_amd64 }}
        digest_linux_arm64: ${{ steps.record.outputs.digest_linux_arm64 }}
        artifact_id_linux_amd64: ${{ steps.record.outputs.artifact_id_linux_amd64 }}
        artifact_id_linux_arm64: ${{ steps.record.outputs.artifact_id_linux_arm64 }}
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            persist-credentials: false
        - name: Platform name
          env:
            PLATFORM: ${{ matrix.platform }}
          run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        - name: Require the runner's own Buildx
          run: docker buildx version
        - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
          with:
            driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
        - name: Build a complete OCI archive (${{ matrix.platform }})
          id: build
          uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
          with:
            context: .
            platforms: ${{ matrix.platform }}
            labels: ${{ needs.meta.outputs.build_labels }}
            outputs: type=oci,dest=${{ runner.temp }}/image.tar,oci-mediatypes=true
            attests: type=sbom,generator=mirror.gcr.io/docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
            provenance: mode=max
            cache-from: type=gha,scope=image-${{ matrix.pair }}
            cache-to: type=gha,mode=max,scope=image-${{ matrix.pair }}
        - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
          id: upload
          with:
            name: image-${{ env.PLATFORM_PAIR }}-${{ github.run_attempt }}
            path: ${{ runner.temp }}/image.tar
            if-no-files-found: error
            retention-days: 1
            compression-level: 0
        - name: Record immutable per-platform handoff
          id: record
          env:
            DIGEST: ${{ steps.build.outputs.digest }}
            ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          run: |
            set -euo pipefail
            [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
            echo "digest_${PLATFORM_PAIR//-/_}=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "artifact_id_${PLATFORM_PAIR//-/_}=${ARTIFACT_ID}" >> "$GITHUB_OUTPUT"
  - file: .github/workflows/image.yml
    job: import-amd64
    definition:
      needs:
        - build
      permissions:
        contents: read
        packages: write
      uses: ./.github/workflows/oci-import.yml
      with:
        artifact_id: ${{ needs.build.outputs.artifact_id_linux_amd64 }}
        root_digest: ${{ needs.build.outputs.digest_linux_amd64 }}
        platform: linux/amd64
        image_repository: ghcr.io/ncecere/open-model-gateway
        source_revision: ${{ github.sha }}
  - file: .github/workflows/image.yml
    job: import-arm64
    definition:
      needs:
        - build
      permissions:
        contents: read
        packages: write
      uses: ./.github/workflows/oci-import.yml
      with:
        artifact_id: ${{ needs.build.outputs.artifact_id_linux_arm64 }}
        root_digest: ${{ needs.build.outputs.digest_linux_arm64 }}
        platform: linux/arm64
        image_repository: ghcr.io/ncecere/open-model-gateway
        source_revision: ${{ github.sha }}
  - file: .github/workflows/image.yml
    job: verify
    definition:
      name: verify (${{ matrix.platform }})
      needs:
        - import-amd64
        - import-arm64
      strategy:
        fail-fast: true
        matrix:
          include:
            - platform: linux/amd64
              runner: ubuntu-24.04
              import_job: import-amd64
              digest_output: digest_linux_amd64
            - platform: linux/arm64
              runner: ubuntu-24.04-arm
              import_job: import-arm64
              digest_output: digest_linux_arm64
      runs-on: ${{ matrix.runner }}
      timeout-minutes: 60
      permissions:
        contents: read
        packages: read
      env:
        DIGEST: ${{ needs[matrix.import_job].outputs[matrix.digest_output] }}
        STAGING_POSTGRES_IMAGE: mirror.gcr.io/library/postgres@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        STAGING_CADDY_IMAGE: mirror.gcr.io/library/caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            persist-credentials: false
        - name: Pull the pushed digest
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            PLATFORM: ${{ matrix.platform }}
          run: |
            set -euo pipefail
            [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for ${PLATFORM} from the build job ('${DIGEST}')"; exit 1; }
            echo "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
            docker pull "${IMAGE}@${DIGEST}"
            # The image under test, the staging stack and Trivy run in later steps:
            # leave no registry credential behind for them.
            docker logout ghcr.io
            got=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE}@${DIGEST}")
            if [ "${got}" != "${PLATFORM}" ]; then
              echo "::error::the digest for ${PLATFORM} is a ${got} image"
              exit 1
            fi
        - name: Check the built version
          env:
            REF_TYPE: ${{ github.ref_type }}
            TAG: ${{ github.ref_name }}
            SOURCE_REVISION: ${{ github.sha }}
          run: |
            revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${IMAGE}@${DIGEST}")
            [ "${revision}" = "${SOURCE_REVISION}" ] || { echo '::error::image source revision mismatch'; exit 1; }
            want=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' apps/gateway/Cargo.toml | head -n1)
            got=$(docker run --rm "${IMAGE}@${DIGEST}" --version)
            echo "image reports: ${got}"
            if [ "${got}" != "open-model-gateway ${want}" ]; then
              echo "::error::the image reports '${got}', not 'open-model-gateway ${want}'"
              exit 1
            fi
            if [ "${REF_TYPE}" = tag ] && [ "${TAG%%-*}" != "v${want}" ]; then
              echo "::error::tag ${TAG} does not match Cargo.toml version ${want}"
              exit 1
            fi
        - name: Staging rehearsal of the pushed digest
          run: |
            python3 scripts/staging.py init
            sed -i "s|^GATEWAY_IMAGE=.*|GATEWAY_IMAGE=${IMAGE}@${DIGEST}|" .local/staging/staging.env
            grep -qx "GATEWAY_IMAGE=${IMAGE}@${DIGEST}" .local/staging/staging.env
            python3 scripts/staging.py db
            python3 scripts/staging.py migrate
            python3 scripts/staging.py up
            python3 scripts/staging.py verify
            python3 scripts/staging.py local-ca
            curl --fail --silent --show-error --cacert .local/staging/local-ca.crt https://localhost:18443/health/ready
            python3 scripts/staging.py restore-check
            # The rehearsal ran the pulled digest, not an image Compose built.
            running=$(docker inspect --format '{{.Image}}' "$(docker ps -q --filter label=com.docker.compose.project=omg-staging --filter label=com.docker.compose.service=gateway)")
            pulled=$(docker image inspect --format '{{.Id}}' "${IMAGE}@${DIGEST}")
            if [ "${running}" != "${pulled}" ]; then
              echo "::error::staging ran ${running}, not the pushed digest (${pulled})"
              exit 1
            fi
        - name: Stop isolated staging
          if: always()
          run: |
            if [ -f .local/staging/staging.env ]; then python3 scripts/staging.py down; fi
        - name: Runtime image contract of the pushed digest
          env:
            OMG_CONTAINER_IMAGE: ${{ env.IMAGE }}@${{ env.DIGEST }}
          run: node --test tests/container-image.test.mjs
        - name: Install Trivy (pinned release, SHA-256 verified)
          run: |
            set -euo pipefail
            case "${RUNNER_ARCH}" in
              X64)
                bash .github/scripts/fetch-verified.sh https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9 "${RUNNER_TEMP}/trivy.tar.gz"
                ;;
              ARM64)
                bash .github/scripts/fetch-verified.sh https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-ARM64.tar.gz 2f6bb988b553a1bbac6bdd1ce890f5e412439564e17522b88a4541b4f364fc8d "${RUNNER_TEMP}/trivy.tar.gz"
                ;;
              *)
                echo "::error::unsupported runner architecture ${RUNNER_ARCH}"
                exit 1
                ;;
            esac
            mkdir -p "${RUNNER_TEMP}/trivy-bin"
            tar -xzf "${RUNNER_TEMP}/trivy.tar.gz" -C "${RUNNER_TEMP}/trivy-bin" trivy
            "${RUNNER_TEMP}/trivy-bin/trivy" --version
            echo "${RUNNER_TEMP}/trivy-bin" >> "$GITHUB_PATH"
        - name: Scan image (${{ matrix.platform }})
          env:
            PLATFORM: ${{ matrix.platform }}
          run: |
            trivy image \
              --platform "${PLATFORM}" \
              --severity CRITICAL,HIGH \
              --exit-code 1 \
              --ignore-unfixed \
              "${IMAGE}@${DIGEST}"
  - file: .github/workflows/image.yml
    job: publish
    definition:
      needs:
        - meta
        - import-amd64
        - import-arm64
        - verify
      runs-on: ubuntu-24.04
      timeout-minutes: 15
      outputs:
        digest: ${{ steps.index.outputs.digest }}
      permissions:
        contents: read
        packages: write
        id-token: write
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            ref: ${{ github.workflow_sha }}
            persist-credentials: false
        - name: Validate publication tags before credentials
          env:
            TAGS: ${{ needs.meta.outputs.tags }}
            GITHUB_REF: ${{ github.ref }}
            GITHUB_SHA: ${{ github.sha }}
          run: python3 -I .github/scripts/publication-tags.py
        - name: Require the runner's own Buildx
          run: docker buildx version
        - name: Authenticate with a private native Docker configuration
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            set -euo pipefail
            umask 077
            export DOCKER_CONFIG
            DOCKER_CONFIG=$(mktemp -d "${RUNNER_TEMP}/docker-auth.XXXXXXXX")
            echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "$GITHUB_ENV"
            printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        - name: Tag the tested digests as one multi-arch image
          id: index
          env:
            TAGS: ${{ needs.meta.outputs.tags }}
            ANNOTATIONS: ${{ needs.meta.outputs.annotations }}
            DIGEST_AMD64: ${{ needs.import-amd64.outputs.digest_linux_amd64 }}
            DIGEST_ARM64: ${{ needs.import-arm64.outputs.digest_linux_arm64 }}
          run: |
            set -euo pipefail
            umask 077
            private=$(mktemp -d "${RUNNER_TEMP}/oci-index.XXXXXXXX")
            trap 'rm -rf -- "${private}"' EXIT
            for d in "${DIGEST_AMD64}" "${DIGEST_ARM64}"; do
              [[ "${d}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::expected 2 tested digests (amd64, arm64); got '${DIGEST_AMD64}' and '${DIGEST_ARM64}'"; exit 1; }
            done
            args=()
            while IFS= read -r tag; do [ -n "${tag}" ] && args+=(--tag "${tag}"); done <<<"${TAGS}"
            while IFS= read -r note; do [ -n "${note}" ] && args+=(--annotation "${note}"); done <<<"${ANNOTATIONS}"
            sources=("${IMAGE}@${DIGEST_AMD64}" "${IMAGE}@${DIGEST_ARM64}")
            docker buildx imagetools create "${args[@]}" "${sources[@]}" --metadata-file "${private}/metadata.json"
            # Buildx writes this descriptor only after successful pushes. Never
            # resolve a mutable tag to select the root that will be signed.
            digest=$(jq -er '."containerimage.descriptor".digest' "${private}/metadata.json")
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::invalid creation digest"; exit 1; }
            docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST_AMD64}" > "${private}/amd64.json"
            docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST_ARM64}" > "${private}/arm64.json"
            docker buildx imagetools inspect --raw "${IMAGE}@${digest}" > "${private}/index.json"
            python3 -I .github/scripts/oci-index.py "${private}/metadata.json" \
              "${private}/amd64.json" "${DIGEST_AMD64}" \
              "${private}/arm64.json" "${DIGEST_ARM64}" \
              "${private}/index.json" "${digest}"
            # Native --raw preserves exact bytes, without adding a newline. An
            # alias race fails closed; it can never change the candidate digest.
            while IFS= read -r tag; do
              [ -n "${tag}" ] || continue
              docker buildx imagetools inspect --raw "${tag}" > "${private}/tag.json"
              hashed=$(sha256sum "${private}/tag.json")
              [ "sha256:${hashed%% *}" = "${digest}" ] || { echo "::error::publication tag changed"; exit 1; }
            done <<<"${TAGS}"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        - name: Install cosign (pinned release, SHA-256 verified)
          run: |
            set -euo pipefail
            mkdir -p "${RUNNER_TEMP}/cosign-bin"
            bash .github/scripts/fetch-verified.sh https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa "${RUNNER_TEMP}/cosign-bin/cosign"
            chmod 0755 "${RUNNER_TEMP}/cosign-bin/cosign"
            echo "${RUNNER_TEMP}/cosign-bin" >> "$GITHUB_PATH"
        - name: Sign (cosign keyless)
          env:
            DIGEST: ${{ steps.index.outputs.digest }}
          run: cosign sign --yes "${IMAGE}@${DIGEST}"
        - name: Job summary
          if: always() && steps.index.outputs.digest != ''
          env:
            DIGEST: ${{ steps.index.outputs.digest }}
            TAGS: ${{ needs.meta.outputs.tags }}
          run: |
            {
              echo "## Image"
              echo
              echo "Deploy by digest:"
              echo
              echo '```'
              echo "${IMAGE}@${DIGEST}"
              echo '```'
              echo
              echo "Tags:"
              echo
              while IFS= read -r tag; do echo "- ${tag}"; done <<<"${TAGS}"
              echo
              echo "Verify the signature:"
              echo
              echo '```'
              echo "cosign verify ${IMAGE}@${DIGEST} \\"
              echo "  --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/image.yml@${GITHUB_REF} \\"
              echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
        - name: Remove registry credentials
          if: always()
          run: |
            if [ -n "${DOCKER_CONFIG:-}" ] && [ -d "${DOCKER_CONFIG}" ]; then
              trap 'rm -rf -- "${DOCKER_CONFIG}"' EXIT
              docker logout ghcr.io
            fi
