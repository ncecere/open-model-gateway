            DOCKER_CONFIG=$(mktemp -d "${RUNNER_TEMP}/docker-auth.XXXXXXXX")
            echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "$GITHUB_ENV"
            printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        - name: Tag only the imported root as dev-SHA12
          run: |
            set -euo pipefail
            [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "${SOURCE_REVISION}" =~ ^[0-9a-f]{40}$ ]]
            tag="${IMAGE}:dev-${SOURCE_REVISION:0:12}"
            docker buildx imagetools create --prefer-index=false --tag "${tag}" "${IMAGE}@${DIGEST}"
            got=$(docker buildx imagetools inspect "${tag}" --format '{{json .Manifest}}' | jq -er .digest)
            [ "${got}" = "${DIGEST}" ]
            printf '`%s`\n\ndigest `%s`\n' "${tag}" "${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
        - name: Remove registry credentials
          if: always()
          run: |
            if [ -n "${DOCKER_CONFIG:-}" ] && [ -d "${DOCKER_CONFIG}" ]; then
              trap 'rm -rf -- "${DOCKER_CONFIG}"' EXIT
              docker logout ghcr.io
            fi
  - file: .github/workflows/oci-import.yml
    job: tools
    definition:
      runs-on: ubuntu-24.04
      timeout-minutes: 20
      permissions:
        contents: read
      outputs:
        artifact_id: ${{ steps.record.outputs.artifact_id }}
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            ref: ${{ github.workflow_sha }}
            path: control
            persist-credentials: false
        - name: Rebuild and verify the dedicated transport tool
          run: |
            set -euo pipefail
            umask 077
            tool_dir=$(mktemp -d "${RUNNER_TEMP}/oci-tool.XXXXXXXX")
            echo "TOOL_DIR=${tool_dir}" >> "$GITHUB_ENV"
            bash control/.github/scripts/build-oras.sh "${tool_dir}/oras"
            [ -f "${tool_dir}/oras" ]
            [ ! -L "${tool_dir}/oras" ]
            expected=$(jq -er '.binary_sha256 | select(test("^[0-9a-f]{64}$"))' control/.github/tools/oras.json)
            printf '%s  %s\n' "${expected}" "${tool_dir}/oras" | sha256sum --check --strict -
        - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
          id: upload
          with:
            name: oras-${{ inputs.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ inputs.artifact_id }}-${{ github.run_attempt }}
            path: ${{ env.TOOL_DIR }}/oras
            if-no-files-found: error
            retention-days: 1
            compression-level: 0
        - name: Record immutable tool artifact ID
          id: record
          env:
            ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          run: |
            set -euo pipefail
            [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
            echo "artifact_id=${ARTIFACT_ID}" >> "$GITHUB_OUTPUT"
        - name: Remove tool handoff
          if: always()
          run: rm -rf -- "${TOOL_DIR:-}"
  - file: .github/workflows/oci-import.yml
    job: preflight
    definition:
      runs-on: ubuntu-24.04
      timeout-minutes: 10
      permissions:
        contents: read
      env:
        ARTIFACT_ID: ${{ inputs.artifact_id }}
        ROOT_DIGEST: ${{ inputs.root_digest }}
        PLATFORM: ${{ inputs.platform }}
        IMAGE: ${{ inputs.image_repository }}
        SOURCE_REVISION: ${{ inputs.source_revision }}
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            ref: ${{ github.workflow_sha }}
            path: control
            persist-credentials: false
        - name: Refuse invalid handoff selectors before download
          run: |
            set -euo pipefail
            [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
            [[ "${ROOT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "${SOURCE_REVISION}" =~ ^[0-9a-f]{40}$ ]]
            case "${PLATFORM}" in linux/amd64|linux/arm64) ;; *) exit 1 ;; esac
            case "${IMAGE}" in ghcr.io/ncecere/open-model-gateway|ghcr.io/ncecere/open-model-gateway-loadtest) ;; *) exit 1 ;; esac
            umask 077
            image_dir=$(mktemp -d "${RUNNER_TEMP}/oci-image.XXXXXXXX")
            echo "IMAGE_DIR=${image_dir}" >> "$GITHUB_ENV"
        - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
          with:
            artifact-ids: ${{ inputs.artifact_id }}
            path: ${{ env.IMAGE_DIR }}
            merge-multiple: true
        - name: Validate complete OCI graph and source revision without extraction
          run: |
            set -euo pipefail
            shopt -s dotglob nullglob
            entries=("${IMAGE_DIR}"/*)
            [ "${#entries[@]}" -eq 1 ]
            [ "${entries[0]}" = "${IMAGE_DIR}/image.tar" ]
            [ -f "${IMAGE_DIR}/image.tar" ]
            [ ! -L "${IMAGE_DIR}/image.tar" ]
            python3 -I - <<'PY'
            import importlib.util, json, os, tarfile
            spec = importlib.util.spec_from_file_location("oci_layout", "control/.github/scripts/oci-layout.py")
            layout = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(layout)
            path = os.path.join(os.environ["IMAGE_DIR"], "image.tar")
            report = layout.inspect_archive(path, os.environ["ROOT_DIGEST"], os.environ["PLATFORM"])
            runnable = next(child for child in report["index"]["manifests"]
                            if child["platform"]["os"] == "linux")
            # Only read JSON already bounded and digest-checked by inspect_archive.
            with tarfile.open(path, mode="r:") as archive:
                def document(digest):
                    return json.load(archive.extractfile("blobs/sha256/" + digest[7:]))
                manifest = document(runnable["digest"])
                config = document(manifest["config"]["digest"])
            revision = config.get("config", {}).get("Labels", {}).get("org.opencontainers.image.revision")
            if revision != os.environ["SOURCE_REVISION"]:
                raise ValueError("config source revision mismatch")
            PY
        - name: Remove image handoff
          if: always()
          run: rm -rf -- "${IMAGE_DIR:-}"
  - file: .github/workflows/oci-import.yml
    job: import
    definition:
      needs:
        - tools
        - preflight
      runs-on: ubuntu-24.04
      timeout-minutes: 15
      permissions:
        contents: read
        packages: write
      outputs:
        digest: ${{ steps.stage.outputs.digest }}
        digest_linux_amd64: ${{ steps.stage.outputs.digest_linux_amd64 }}
        digest_linux_arm64: ${{ steps.stage.outputs.digest_linux_arm64 }}
      env:
        ARTIFACT_ID: ${{ inputs.artifact_id }}
        TOOL_ARTIFACT_ID: ${{ needs.tools.outputs.artifact_id }}
        ROOT_DIGEST: ${{ inputs.root_digest }}
        PLATFORM: ${{ inputs.platform }}
        IMAGE: ${{ inputs.image_repository }}
        SOURCE_REVISION: ${{ inputs.source_revision }}
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            ref: ${{ github.workflow_sha }}
            path: control
            persist-credentials: false
        - name: Refuse invalid handoff selectors before download
          run: |
            set -euo pipefail
            [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
            [[ "${TOOL_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
            [ "${ARTIFACT_ID}" != "${TOOL_ARTIFACT_ID}" ]
            [[ "${ROOT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "${SOURCE_REVISION}" =~ ^[0-9a-f]{40}$ ]]
            case "${PLATFORM}" in linux/amd64|linux/arm64) ;; *) exit 1 ;; esac
            case "${IMAGE}" in ghcr.io/ncecere/open-model-gateway|ghcr.io/ncecere/open-model-gateway-loadtest) ;; *) exit 1 ;; esac
            umask 077
            image_dir=$(mktemp -d "${RUNNER_TEMP}/oci-image.XXXXXXXX")
            tool_dir=$(mktemp -d "${RUNNER_TEMP}/oci-tool.XXXXXXXX")
            echo "IMAGE_DIR=${image_dir}" >> "$GITHUB_ENV"
            echo "TOOL_DIR=${tool_dir}" >> "$GITHUB_ENV"
        - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
          with:
            artifact-ids: ${{ inputs.artifact_id }}
            path: ${{ env.IMAGE_DIR }}
            merge-multiple: true
        - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
          with:
            artifact-ids: ${{ needs.tools.outputs.artifact_id }}
            path: ${{ env.TOOL_DIR }}
            merge-multiple: true
        - name: Repeat graph and revision checks and verify static tool pin before credentials
          run: |
            set -euo pipefail
            shopt -s dotglob nullglob
            images=("${IMAGE_DIR}"/*)
            tools=("${TOOL_DIR}"/*)
            [ "${#images[@]}" -eq 1 ]
            [ "${images[0]}" = "${IMAGE_DIR}/image.tar" ]
            [ "${#tools[@]}" -eq 1 ]
            [ "${tools[0]}" = "${TOOL_DIR}/oras" ]
            [ -f "${IMAGE_DIR}/image.tar" ]
            [ ! -L "${IMAGE_DIR}/image.tar" ]
            [ -f "${TOOL_DIR}/oras" ]
            [ ! -L "${TOOL_DIR}/oras" ]
            expected=$(jq -er '.binary_sha256 | select(test("^[0-9a-f]{64}$"))' control/.github/tools/oras.json)
            printf '%s  %s\n' "${expected}" "${TOOL_DIR}/oras" | sha256sum --check --strict -
            python3 -I - <<'PY'
            import importlib.util, json, os, tarfile
            spec = importlib.util.spec_from_file_location("oci_layout", "control/.github/scripts/oci-layout.py")
            layout = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(layout)
            path = os.path.join(os.environ["IMAGE_DIR"], "image.tar")
            report = layout.inspect_archive(path, os.environ["ROOT_DIGEST"], os.environ["PLATFORM"])
            runnable = next(child for child in report["index"]["manifests"]
                            if child["platform"]["os"] == "linux")
            with tarfile.open(path, mode="r:") as archive:
                def document(digest):
                    return json.load(archive.extractfile("blobs/sha256/" + digest[7:]))
                manifest = document(runnable["digest"])
                config = document(manifest["config"]["digest"])
            revision = config.get("config", {}).get("Labels", {}).get("org.opencontainers.image.revision")
            if revision != os.environ["SOURCE_REVISION"]:
                raise ValueError("config source revision mismatch")
            PY
            chmod 0700 "${TOOL_DIR}/oras"
        - name: Stage only the known root, never a tag
          id: stage
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GITHUB_ACTOR: ${{ github.actor }}
          run: |
            set -euo pipefail
            digest=$(python3 -I control/.github/scripts/oci-stage.py --archive "${IMAGE_DIR}/image.tar" --root "${ROOT_DIGEST}" --platform "${PLATFORM}" --image "${IMAGE}" --tool "${TOOL_DIR}/oras")
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [ "${digest}" = "${ROOT_DIGEST}" ]
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "digest_${PLATFORM//\//_}=${digest}" >> "$GITHUB_OUTPUT"
        - name: Remove private handoffs
          if: always()
          run: rm -rf -- "${IMAGE_DIR:-}" "${TOOL_DIR:-}"
  - file: .github/workflows/prune-dev-images.yml
    job: prune
    definition:
      runs-on: ubuntu-24.04
      timeout-minutes: 15
      permissions:
        contents: read
        packages: write
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OWNER: ${{ github.repository_owner }}
        PACKAGES: |
          open-model-gateway
          open-model-gateway-loadtest
        OLDER_THAN_DAYS: ${{ inputs.older_than_days || '14' }}
        DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      steps:
        - name: Prune
          run: |
            set -euo pipefail
            [[ "$OLDER_THAN_DAYS" =~ ^[0-9]+$ ]] || { echo "::error::older_than_days must be a number"; exit 1; }
            cutoff="$(date -u -d "$OLDER_THAN_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)"
            echo "Development images created before $cutoff (dry run: $DRY_RUN)"
            deleted=0
            while read -r package; do
              [ -n "$package" ] || continue
              echo "## $package"
              versions="$(gh api --paginate "/users/$OWNER/packages/container/$package/versions?per_page=100" | jq -s 'add // []')"
              # candidates: tagged, every tag is dev-<12 hex>, older than the cutoff
              ids="$(jq -r --arg cutoff "$cutoff" '
                .[] | select((.metadata.container.tags | length) > 0)
                    | select(all(.metadata.container.tags[]; test("^dev-[0-9a-f]{12}$")))
                    | select(.created_at < $cutoff)
                    | "\(.id) \(.metadata.container.tags | join(","))"' <<<"$versions")"
              total="$(jq 'length' <<<"$versions")"
              echo "$total versions in the package"
              while read -r id tags; do
                [ -n "${id:-}" ] || continue
                if [ "$DRY_RUN" = true ]; then
                  echo "would delete $id ($tags)"
                else
                  gh api -X DELETE "/users/$OWNER/packages/container/$package/versions/$id"
                  echo "deleted $id ($tags)"
                fi
                deleted=$((deleted + 1))
              done <<<"$ids"
            done <<<"$PACKAGES"
            echo "candidates: $deleted (dry run: $DRY_RUN)" | tee -a "$GITHUB_STEP_SUMMARY"
  - file: .github/workflows/ci.yml
    job: staging-image
    definition:
      if: github.event_name != 'push' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
      runs-on: ubuntu-24.04
      timeout-minutes: 35
      env:
        STAGING_POSTGRES_IMAGE: mirror.gcr.io/library/postgres@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        STAGING_CADDY_IMAGE: mirror.gcr.io/library/caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            persist-credentials: false
        - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
          with:
            driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
        - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
          with:
            context: .
            load: true
            tags: open-model-gateway:staging
            cache-from: type=gha,scope=staging
            cache-to: type=gha,mode=max,scope=staging
        - name: Install Trivy (pinned release, SHA-256 verified)
          run: |
            set -euo pipefail
            bash .github/scripts/fetch-verified.sh https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9 "${RUNNER_TEMP}/trivy.tar.gz"
            mkdir -p "${RUNNER_TEMP}/trivy-bin"
            tar -xzf "${RUNNER_TEMP}/trivy.tar.gz" -C "${RUNNER_TEMP}/trivy-bin" trivy
            "${RUNNER_TEMP}/trivy-bin/trivy" --version
        - name: Scan the candidate image and the arm64 runtime base
          env:
            APPROVED_RUNTIME: gcr.io/distroless/cc-debian13:nonroot@sha256:cc66d222f0a7ec996b78a99fe76a969bc80b539a5016ad866c14d1949bc6d0ab
          run: |
            set -euo pipefail
            cd "$(mktemp -d)"
            "${RUNNER_TEMP}/trivy-bin/trivy" image --image-src docker --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed open-model-gateway:staging
            "${RUNNER_TEMP}/trivy-bin/trivy" image --image-src remote --platform linux/arm64 --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed "${APPROVED_RUNTIME}"
        - name: Migrate and verify isolated runtime authority over HTTPS
          run: |
            python3 scripts/staging.py init
            python3 scripts/staging.py db
            python3 scripts/staging.py migrate
            python3 scripts/staging.py up
            python3 scripts/staging.py verify
            python3 scripts/staging.py local-ca
            curl --fail --silent --show-error --cacert .local/staging/local-ca.crt https://localhost:18443/health/ready
            python3 scripts/staging.py restore-check
        - name: Stop isolated staging (retain volumes; runner is disposable)
          if: always()
          run: python3 scripts/staging.py down
        - uses: ./.github/actions/setup-node
        - name: Runtime image contract
          env:
            OMG_CONTAINER_IMAGE: open-model-gateway:staging
          run: npm run test:container
  - file: .github/workflows/ci.yml
    job: image
    definition:
      needs:
        - gateway
        - web
        - browser
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      permissions:
        contents: write
        packages: write
        id-token: write
      uses: ./.github/workflows/image.yml
