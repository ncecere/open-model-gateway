; PgBouncer for the load-test stack (docs/operations.md "PgBouncer").
; Transaction pooling with protocol-level prepared statement support, which
; sqlx needs: it caches *named* prepared statements per connection
; (decision gate D4 in the scale design). With max_prepared_statements = 0
; the gateway fails with "prepared statement ... does not exist".
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer-loadtest/userlist.txt
pool_mode = transaction
max_prepared_statements = 200
; 3 replicas x up to 32 client connections, plus tools.
max_client_conn = 500
default_pool_size = 40
reserve_pool_size = 0
server_lifetime = 3600
server_idle_timeout = 600
; sqlx sends extra_float_digits as a startup parameter.
ignore_startup_parameters = extra_float_digits
stats_users = gateway_migrator
log_connections = 0
log_disconnections = 0
