# Development-only, distinct from existing gateway/staging/enterprise-test volumes.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway_enterprise_demo
    ports:
      - "127.0.0.1:54349:5432"
    volumes:
      - enterprise-demo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_enterprise_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  enterprise-demo-postgres:
