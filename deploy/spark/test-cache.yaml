# The build cache of one Spark test slot (scripts/spark-test.py): the cargo registry, the
# target directory, the rustup home, the npm cache and the source checkout. It lives in the
# slot's own namespace (a pod can only mount a volume of its namespace), survives `down`
# and is removed by `spark-test.py purge`. 30Gi per slot, two slots: 60 of the shared 100 GiB.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omg-test-cache
  labels: {app.kubernetes.io/name: omg-test-cache}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 30Gi}
