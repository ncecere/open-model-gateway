# The passwordless demo gateway for the Spark test platform (scripts/spark-env.py applies
# this after bootstrap-job.yaml has completed). The demo gateway insists on a loopback
# listener and a loopback database host, and the demo issuer is fixed to
# http://127.0.0.1:18084, so the gateway, a database forwarder and the issuer share one
# pod network namespace and are reached only through `kubectl port-forward` (never a
# Service or Ingress). __IMAGE__ is replaced by the script with the image under test.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omg-demo
  labels: {app.kubernetes.io/name: omg-demo}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: omg-demo}
  template:
    metadata:
      labels: {app.kubernetes.io/name: omg-demo}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: pg-forward
          image: &node mirror.gcr.io/library/node:22.23.4-bookworm-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
          restartPolicy: Always
          command: [node, /scripts/pg-forward.mjs]
          # Native sidecar startup gates the next init container; probe inside its loopback network.
          startupProbe:
            exec:
              command: [node, /scripts/loopback-probe.mjs, "5432"]
            periodSeconds: 1
            timeoutSeconds: 3
            failureThreshold: 60
          resources: &small
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext: &locked
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: scripts, mountPath: /scripts, readOnly: true}]
        - name: demo-issuer
          image: *node
          restartPolicy: Always
          # ConfigMap files are symlinks; the script only starts when its entry path is its real path.
          command: [node, --preserve-symlinks-main, --preserve-symlinks, /scripts/demo-oidc.mjs]
          env: [{name: OMG_ENABLE_LOCAL_DEMO, value: "1"}]
          # Native sidecar startup gates the next init container; probe inside its loopback network.
          startupProbe:
            exec:
              command: [node, /scripts/loopback-probe.mjs, "18084"]
            periodSeconds: 1
            timeoutSeconds: 3
            failureThreshold: 60
          resources: *small
          securityContext: *locked
          volumeMounts: [{name: scripts, mountPath: /scripts, readOnly: true}]
        - name: wait-for-schema
          image: __IMAGE__
          args: [wait-for-database, --schema]
          env:
            - {name: PG_USER, valueFrom: {secretKeyRef: {name: omg-runtime-role, key: username}}}
            - {name: PG_PASSWORD, valueFrom: {secretKeyRef: {name: omg-runtime-role, key: password}}}
            - {name: DATABASE_URL, value: "postgres://$(PG_USER):$(PG_PASSWORD)@127.0.0.1:5432/gateway_enterprise_demo"}
            - {name: GATEWAY_ENV, value: development}
            - {name: GATEWAY_LISTEN, value: "127.0.0.1:3000"}
          resources: &gateway-resources
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext: *locked
      containers:
        - name: gateway
          image: __IMAGE__
          args: [serve]
          env:
            - {name: PG_USER, valueFrom: {secretKeyRef: {name: omg-runtime-role, key: username}}}
            - {name: PG_PASSWORD, valueFrom: {secretKeyRef: {name: omg-runtime-role, key: password}}}
            - {name: DATABASE_URL, value: "postgres://$(PG_USER):$(PG_PASSWORD)@127.0.0.1:5432/gateway_enterprise_demo"}
            - {name: GATEWAY_ENV, value: development}
            - {name: GATEWAY_LISTEN, value: "127.0.0.1:3000"}
            - {name: GATEWAY_PUBLIC_URL, value: "http://127.0.0.1:3000"}
            - {name: GATEWAY_OIDC_ISSUER, value: "http://127.0.0.1:18084"}
            - {name: GATEWAY_OIDC_CLIENT_ID, value: gateway-local-demo}
            - {name: GATEWAY_OIDC_GROUPS_CLAIM, value: groups}
            - {name: GATEWAY_SECRET_ENV_ALLOWLIST, value: ""}
            - {name: GATEWAY_LOCAL_UPSTREAMS, value: '[{"endpoint":"http://127.0.0.1:19091/v1","addresses":["127.0.0.1"]}]'}
          # The listener is loopback-only, so kubelet cannot probe it over the pod IP.
          startupProbe:
            exec: {command: [/usr/local/bin/open-model-gateway, healthcheck, --timeout, 3s]}
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            exec: {command: [/usr/local/bin/open-model-gateway, healthcheck, --timeout, 3s]}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: [/usr/local/bin/open-model-gateway, healthcheck, --url, "http://127.0.0.1:3000/health/live", --timeout, 3s]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources: *gateway-resources
          securityContext: *locked
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: scripts
          configMap: {name: omg-demo-scripts}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
