# Existing Anthropic acceptance only; no inference is triggered by this overlay.
services:
  gateway:
    environment:
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets: [anthropic_api_key]
secrets:
  anthropic_api_key:
    file: ${STAGING_SECRETS_DIR:-../../.local/staging/secrets}/anthropic_api_key
