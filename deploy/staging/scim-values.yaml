# PREPARATION ONLY (#60): operator-approved routing, NOT PUBLISHED / NOT RUN.
# No apply, DNS/IdP mutation or live acceptance is implied.
# Use release omg-scim60 and --namespace dev-omg; see docs/live-acceptance.md.
fullnameOverride: omg-scim60
replicaCount: 0
hpa:
  enabled: false
pdb:
  enabled: false
service:
  type: ClusterIP
ingress:
  enabled: false

# Direct Pangolin -> Newt -> this Service: no Traefik/global policy changes.
networkPolicy:
  enabled: true
  ingress:
    fromNamespace: pangolin
    fromPodLabels:
      app.kubernetes.io/name: newt
    metrics:
      enabled: false
  egress:
    # Do not override the namespace's public-web RFC1918 exclusions with any:443.
    allowHttpsEgress: false

image:
  repository: ghcr.io/ncecere/open-model-gateway
  # Signed/verified v0.9.1 release root (multi-arch index), not a newer release.
  tag: v0.9.1
  digest: sha256:da03b565093fded73b6ddbc636d56b60811b4c5dcbfc4956ce62bf4efe0cb819

gateway:
  env:
    GATEWAY_ENV: production
    GATEWAY_LISTEN: "0.0.0.0:8080"
    # Operator-approved dedicated origin; DNS/TLS/routing NOT PUBLISHED / NOT RUN.
    GATEWAY_PUBLIC_URL: "https://omg-scim60.bitop.dev"
    GATEWAY_OIDC_GROUPS_CLAIM: groups
    GATEWAY_SCIM_TOKEN_ENV: OMG_SCIM60_TOKEN
  extraEnv:
    - name: OMG_SCIM60_TOKEN
      valueFrom:
        secretKeyRef:
          name: omg-scim60-scim
          key: OMG_SCIM60_TOKEN

secrets:
  oidc:
    enabled: true
    # Dedicated ordinary Authentik app issuer/client; no demo issuer.
    existingSecret: omg-scim60-oidc

# Set true explicitly for the reviewed fresh initial install at zero replicas;
# leave false for activation and subsequent migration-free upgrades.
migrations:
  run: false
  backoffLimit: 0

cnpg:
  cluster:
    enabled: true
    instances: 1
    # Plain PG18 from the qualified clean homelab postgres-18 catalog.
    image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie@sha256:37ade18dbdddba430858c72725aceeec66f33fa5333e82ea1df4942f6c1c83a3
    storageClass: local-dev
    storageSize: 5Gi
    walStorageSize: 1Gi
    minSyncReplicas: 0
    maxSyncReplicas: 0
    database: omg_scim60
    roles:
      migrator:
        name: gateway_migrator
        existingSecret: omg-scim60-migrator-role
      runtime:
        name: gateway_runtime
        existingSecret: omg-scim60-runtime-role
    postgresql:
      parameters:
        max_wal_size: 512MB
  pooler:
    # Disable only chart creation: scim-pooler.yaml is REQUIRED and separately
    # owned, with an explicit published image digest. Keep false on activation
    # and upgrades; runtime URLs still target omg-scim60-pooler.
    enabled: false
    instances: 1
