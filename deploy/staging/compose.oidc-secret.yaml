# Optional additional overlay for confidential OIDC clients. No empty placeholder.
services:
  gateway:
    environment:
      GATEWAY_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    secrets: [oidc_client_secret]
secrets:
  oidc_client_secret:
    file: ${STAGING_SECRETS_DIR:-../../.local/staging/secrets}/oidc_client_secret
