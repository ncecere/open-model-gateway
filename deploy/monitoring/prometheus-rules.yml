# Example Prometheus alerting rules for open-model-gateway (docs/operations.md).
# Scrape the separate GATEWAY_METRICS_ADDR listener with job="open-model-gateway".
# Thresholds are starting points: tune them to your traffic and objectives.
groups:
  - name: open-model-gateway.availability
    rules:
      - alert: GatewayMetricsDown
        expr: up{job="open-model-gateway"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: Gateway metrics endpoint is unreachable
          description: "{{ $labels.instance }} has not been scraped for 5 minutes. Check the process, GATEWAY_METRICS_ADDR and the private scrape network."
      - alert: GatewayHigh5xxRate
        expr: |
          sum by (instance) (rate(gateway_http_requests_total{status=~"5.."}[5m]))
            / sum by (instance) (rate(gateway_http_requests_total[5m])) > 0.05
          and sum by (instance) (rate(gateway_http_requests_total[5m])) > 0.1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: More than 5% of gateway responses are 5xx
          description: "Check /health/ready, database reachability and gateway_inference_attempt_errors_total by code."
      - alert: GatewayInferenceLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le, route) (rate(gateway_http_request_duration_seconds_bucket{route=~"/v1/.*"}[5m]))) > 10
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "p95 time to response headers above 10s on {{ $labels.route }}"
          description: "Admission serializes on the installation lock; compare with gateway_db_pool_connections and upstream latency."

  - name: open-model-gateway.alert-email
    rules:
      - alert: GatewayAlertEmailPersistentFailure
        expr: max(gateway_alert_email_deliveries{state=~"failed|exhausted"}) > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Alert email has persistent terminal delivery failures
          description: "A delivery failed or exhausted retries within the last 24 hours (by completion time, including expired-delivery cleanup). Check incident History, relay availability and SMTP configuration. Use an independent operational channel; do not feed this back into gateway email incidents. Crash recovery can duplicate accepted mail."

  - name: open-model-gateway.accounting
    rules:
      # Accounting failures (#389, docs/operations.md#accounting-failures): each
      # one is a `503 accounting_unavailable` or a settlement that did not finish.
      # No series exists before the first failure; a rate over a missing series
      # is empty, so `> 0` yields nothing and the alert stays silent without any
      # `absent()` or `or vector(0)` that could fire on missing data. (The very
      # first increment of a new series is not seen by rate(); a sustained
      # failure is.) `for: 5m` asks for failures in every 5-minute window for
      # 5 minutes: a sustained failure, not one blip. Admission, route lookup and
      # storage failures refuse requests but leave no money held: warning. A
      # settlement that misses its deadline leaves its reservation held until
      # reconciliation, which can block budgeted admission: critical.
      - alert: GatewayAccountingFailures
        expr: |
          sum by (stage, cause) (rate(gateway_accounting_failures_total{stage!~"explicit_settlement|cancellation_settlement"}[5m])) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Accounting failing at {{ $labels.stage }} ({{ $labels.cause }}); requests get 503 accounting_unavailable"
          description: "Sustained for 5 minutes. Check database health, pool saturation (gateway_db_pool_connections) and lock waits; the WARN log line `accounting unavailable` carries the same stage and cause."
          runbook_url: docs/operations.md#accounting-failures
      - alert: GatewaySettlementAccountingFailures
        expr: |
          sum by (stage, cause) (rate(gateway_accounting_failures_total{stage=~"explicit_settlement|cancellation_settlement"}[5m])) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Settlements missing their deadline at {{ $labels.stage }} ({{ $labels.cause }}); reservations stay held"
          description: "Sustained for 5 minutes. Holds are retained, never refunded as zero, and can block budgeted admission. deadline_in_queue or deadline_acquiring_connection point to a starved pool, deadline_in_database to lock or statement waits."
          runbook_url: docs/operations.md#accounting-failures
      - alert: GatewaySettlementHeld
        expr: increase(gateway_settlements_total{outcome="held"}[15m]) > 0
        labels: {severity: warning}
        annotations:
          summary: Attempt finalization failed; reservations are held pending reconciliation
          description: "Holds are retained (never refunded as zero). The maintenance loop moves expired leases to unknown. Investigate database health; resolve unknown usage deliberately."
      - alert: GatewayUnknownReservationsGrowing
        expr: gateway_reservations_held{state="unknown"} > 0 and delta(gateway_reservations_held{state="unknown"}[1h]) > 0
        for: 1h
        labels: {severity: info}
        annotations:
          summary: Unresolved-cost reservations are accumulating
          description: "Unknown usage keeps budget holds and can block budgeted admission. Review it in the dashboard and resolve deliberately."
      - alert: GatewayPendingReservationsHigh
        # In-flight requests are pending normally; a sustained floor means leases are not being reconciled.
        expr: min_over_time(gateway_reservations_held{state="pending"}[30m]) > 100
        labels: {severity: warning}
        annotations:
          summary: Pending reservations stayed above 100 for 30 minutes
      - alert: GatewayBudgetDenials
        expr: sum by (scope) (rate(gateway_admission_denials_total{code=~"budget_exceeded|unresolved_usage"}[10m])) > 0.05
        for: 10m
        labels: {severity: info}
        annotations:
          summary: "Budget denials at {{ $labels.scope }} scope"
      - alert: GatewayCapacitySaturated
        expr: sum by (instance) (rate(gateway_admission_denials_total{scope="gateway_capacity"}[5m])) > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Requests rejected by GATEWAY_MAX_CONCURRENT_REQUESTS
          description: "Scale out replicas or raise the per-replica concurrency limit after load testing."

  - name: open-model-gateway.upstream
    rules:
      - alert: GatewayUpstreamFailureRate
        expr: |
          sum by (provider) (rate(gateway_inference_attempts_total{outcome="failed"}[10m]))
            / sum by (provider) (rate(gateway_inference_attempts_total[10m])) > 0.2
          and sum by (provider) (rate(gateway_inference_attempts_total[10m])) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "More than 20% of {{ $labels.provider }} attempts fail"
          description: "See gateway_inference_attempt_errors_total{provider=\"{{ $labels.provider }}\"} by code."
      - alert: GatewayTimeToFirstTokenHigh
        expr: |
          histogram_quantile(0.95, sum by (le, provider) (rate(gateway_upstream_time_to_first_token_seconds_bucket[10m]))) > 15
        for: 15m
        labels: {severity: info}
        annotations:
          summary: "p95 time to first token above 15s for {{ $labels.provider }}"

  - name: open-model-gateway.internals
    rules:
      - alert: GatewayDatabasePoolSaturated
        expr: |
          gateway_db_pool_connections{state="in_use"}
            / ignoring(state) gateway_db_pool_max_connections >= 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Database pool at 90% or more on {{ $labels.instance }}
          description: "Raise GATEWAY_DATABASE_MAX_CONNECTIONS within PostgreSQL max_connections, or scale replicas."
      - alert: GatewayScopeLockWaitHigh
        # One workspace or key near its scoped-admission ceiling (metrics carry
        # no scope ids; the in-app `admission_ceiling` rule names the scope).
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(gateway_scope_lock_wait_seconds_bucket{lock="rows",path="admission"}[5m]))) > 0.1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Admissions wait over 100 ms (p95) for their workspace or key totals rows
          description: "One hot workspace or key serializes its own admissions. Add an admission_ceiling alert rule to see which; spread the traffic over workspaces or keys."
      - alert: GatewayAlertEvaluatorFailing
        expr: increase(gateway_alert_evaluations_total{result="failed"}[30m]) > 2 or increase(gateway_alert_rule_failures_total[30m]) > 0
        labels: {severity: warning}
        annotations:
          summary: In-app alert evaluation is failing
      - alert: GatewayMetricsCollectorErrors
        expr: increase(gateway_metrics_collection_errors_total[15m]) > 0
        labels: {severity: info}
        annotations:
          summary: "Scrape-time collector {{ $labels.collector }} failed; gauges show their last value"
