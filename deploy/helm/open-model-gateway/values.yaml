# Default values for open-model-gateway.
# See docs/kubernetes.md for the full field reference and upgrade procedure.
# AGENTS.md "Deployment" rules apply: never migrate/bootstrap in `serve`,
# runtime role has explicit ACLs only, secrets are referenced (never
# generated by this chart), distroless image, exec `healthcheck` probes.

nameOverride: ""
fullnameOverride: ""

image:
  # Promote by digest (docs/staging.md "Image CI and registry publication").
  # repository+digest together form the pulled reference; `tag` is used only
  # when `digest` is empty (for local/dev iteration, never for a real rollout).
  # v0.4.0's digest is unknown until CI publishes it; pin `digest` to the
  # verified digest from docs/releases/v0.4.0.md#verifying-the-images before
  # a real rollout.
  repository: ghcr.io/ncecere/open-model-gateway
  digest: ""
  tag: v0.4.0
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 3

gateway:
  # Non-secret environment. Secret-bearing variables are configured under
  # `secrets` below and never placed here.
  env:
    GATEWAY_ENV: production
    GATEWAY_LISTEN: "0.0.0.0:8080"
    GATEWAY_METRICS_ADDR: "0.0.0.0:9464"
    GATEWAY_DATABASE_MAX_CONNECTIONS: "32"
    GATEWAY_MAX_CONCURRENT_REQUESTS: "128"
    GATEWAY_REQUEST_TIMEOUT_SECONDS: "120"
    GATEWAY_ADMISSION_MODE: scoped
    GATEWAY_CONFIG_CACHE: "on"
  # Extra non-secret env vars/entries merged into the ConfigMap (list form,
  # same shape as a container `env[]` entry; use for valueFrom references).
  extraEnv: []
  # Secret env vars sourced via envFrom/secretKeyRef from existing Secrets,
  # for provider keys not covered by the four `_FILE` names below
  # (GATEWAY_SECRET_ENV_ALLOWLIST must list every name used this way).
  extraEnvFrom: []
  secretEnvAllowlist: []

  drainSeconds: 10
  terminationGracePeriodSeconds: 150

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  # Small writable tmpfs; the binary itself needs no writable path (operations.md).
  tmpSizeLimit: 16Mi

  probes:
    # Native HTTP probes (operations.md recommends httpGet over exec in Kubernetes).
    startup:
      httpGet:
        path: /health/ready
        port: http
      periodSeconds: 5
      failureThreshold: 60
      timeoutSeconds: 3
    liveness:
      httpGet:
        path: /health/live
        port: http
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health/ready
        port: http
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabelsFromSelector: true

  affinity: {}
  nodeSelector: {}
  tolerations: []

  serviceAccount:
    create: true
    name: ""
    automount: false
    annotations: {}

service:
  type: ClusterIP
  port: 8080
  metricsPort: 9464

ingress:
  enabled: false
  className: traefik-internal
  annotations: {}
  host: gateway.bitop.dev
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

networkPolicy:
  enabled: true
  ingress:
    # Traefik ingress controller namespace/pod labels (homelab convention).
    fromNamespace: traefik
    fromPodLabels:
      app.kubernetes.io/name: traefik
    metrics:
      enabled: false
      fromNamespace: ""
      fromPodLabels: {}
  egress:
    dns: true
    # Allowed outbound 443 (OIDC issuer, provider APIs, SMTP relay, S3).
    allowHttpsEgress: true
    extraEgress: []

metrics:
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  podMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    labels: {}

hpa:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # Custom metric example (scale-design.md 8.1); requires a metrics adapter
  # exposing `gateway_inflight_requests` (e.g. Prometheus Adapter / KEDA).
  customMetrics: []
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600

pdb:
  enabled: true
  maxUnavailable: 1

# --- Secrets by reference (existingSecret names/keys). This chart never
# generates or stores a secret value; operators create these Secrets first
# (sealed-secrets, External Secrets Operator, SOPS, or kubectl create secret). ---
secrets:
  database:
    # Mode "external": the chart only reads these references.
    # Mode "cnpg": leave unset to use the generated CNPG Pooler/Cluster
    # connection secrets (see cnpg.cluster.enabled below) unless overridden.
    runtime:
      existingSecret: ""
      urlKey: DATABASE_URL
    listen:
      existingSecret: ""
      urlKey: GATEWAY_LISTEN_DATABASE_URL
    reporting:
      enabled: false
      existingSecret: ""
      urlKey: GATEWAY_REPORTING_DATABASE_URL
      maxLagSeconds: 30
  migrator:
    # Mounted only in the migration Job, never in the gateway Deployment.
    existingSecret: ""
    urlKey: DATABASE_URL
  oidc:
    enabled: false
    existingSecret: ""
    clientIdKey: GATEWAY_OIDC_CLIENT_ID
    issuerKey: GATEWAY_OIDC_ISSUER
    clientSecretKey: GATEWAY_OIDC_CLIENT_SECRET
  # Provider API keys use the binary's `_FILE` import for the four built-in
  # names, or `extraEnvFrom`/`secretEnvAllowlist` above for anything else.
  providers:
    openaiApiKey:
      enabled: false
      existingSecret: ""
      key: OPENAI_API_KEY
    anthropicApiKey:
      enabled: false
      existingSecret: ""
      key: ANTHROPIC_API_KEY
  fileStore:
    enabled: false
    existingSecret: ""
    encryptionKeysEnvVar: GATEWAY_FILE_ENCRYPTION_KEYS_ENV
    encryptionKeysKey: GATEWAY_FILE_ENCRYPTION_KEYS

# --- Migration Job (pre-install/pre-upgrade Helm hook). Disabled by default;
# AGENTS.md forbids automatic migration in `serve`, so running it is an
# explicit operator action (`--set migrations.run=true`). ---
migrations:
  run: false
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # No Rust `apply-runtime-grants` subcommand exists yet (docs/kubernetes.md
  # "Migration job and runtime grants"). The grants step runs psql against
  # deploy/staging/runtime-grants.sql, embedded as a ConfigMap by this chart.
  grants:
    image:
      repository: mirror.gcr.io/library/postgres
      tag: "17-alpine"
      digest: ""

# --- CloudNativePG Cluster + Pooler (optional). Set cnpg.cluster.enabled to
# deploy a dedicated database for this release; otherwise point
# secrets.database.* / secrets.migrator at an external database. ---
cnpg:
  cluster:
    enabled: false
    instances: 2
    storageClass: local-ssd
    storageSize: 20Gi
    walStorageSize: 5Gi
    image: ghcr.io/cloudnative-pg/postgresql:17.6
    minSyncReplicas: 1
    maxSyncReplicas: 1
    database: gateway
    # Connection string suffix, e.g. "disable" or "require"; empty uses the
    # driver default. CNPG does not enable TLS on the client port by default.
    sslMode: ""
    # Database roles, each backed by an operator-created basic-auth Secret
    # (keys `username`/`password`; CNPG never generates these for this chart).
    # `migrator.existingSecret` becomes the initdb owner via
    # `bootstrap.initdb.secret`; `runtime.existingSecret` becomes a CNPG
    # managed role via `managed.roles[].passwordSecret`, granted only the
    # privileges in deploy/staging/runtime-grants.sql (run by the migration
    # Job, never owner/DDL privileges from CNPG itself).
    roles:
      migrator:
        name: gateway_migrator
        existingSecret: ""
        usernameKey: username
        passwordKey: password
      runtime:
        name: gateway_runtime
        existingSecret: ""
        usernameKey: username
        passwordKey: password
    # Node pinning (optional): bitop-talos has ~200GB on cp-1/cp-3 and ~100GB
    # on cp-2; pin instances away from cp-2 for a Cluster this size if desired.
    nodeSelector: {}
    additionalPodAntiAffinity: true
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
    # Starting points from docs/operations.md "Tuning starting points",
    # scaled down for the chart defaults; override for production sizing.
    postgresql:
      parameters:
        shared_buffers: 256MB
        effective_cache_size: 768MB
        max_wal_size: 2GB
        wal_compression: "zstd"
        checkpoint_timeout: 15min
        idle_in_transaction_session_timeout: 60s
        track_io_timing: "on"
        autovacuum_naptime: 10s
        log_lock_waits: "on"
        deadlock_timeout: 1s
    backup:
      enabled: false
      scheduledBackup:
        schedule: "0 0 3 * * *"
      destinationPath: ""
      barmanObjectStore: {}
  pooler:
    enabled: true
    type: rw
    instances: 2
    poolMode: transaction
    parameters:
      max_client_conn: "200"
      default_pool_size: "25"
      max_prepared_statements: "200"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# --- Loadtest profile (P8): mock-upstream + loadgen Jobs built from
# tools/mock-upstream and tools/loadgen (deploy/loadtest/Dockerfile).
# See docs/kubernetes.md#loadtest-profile for the local build command. ---
loadtest:
  enabled: false
  image:
    repository: omg-loadtest
    tag: local
    digest: ""
    pullPolicy: IfNotPresent
  mockUpstream:
    replicas: 1
    # Fixed ClusterIP so GATEWAY_LOCAL_UPSTREAMS can pin a literal destination
    # address (the approval model in providers/local/endpoints.rs never
    # resolves DNS, so a Service DNS name alone cannot be approved). Pick an
    # address free in your cluster's service CIDR (kind default: 10.96.0.0/16,
    # see ci/loadtest-values.yaml); leave empty to assign GATEWAY_LOCAL_UPSTREAMS
    # yourself via gateway.extraEnv instead of the chart-computed default.
    clusterIP: ""
    latencyMs: 50
    ttftMs: 30
    interTokenMs: 5
    completionTokens: 4
    errorRate: 0
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  loadgen:
    # Separate from loadtest.enabled: this one-shot Job has no Helm hook
    # annotation (templates/loadtest-loadgen-job.yaml), so a plain
    # `helm install`/`upgrade --wait` would otherwise apply it immediately
    # and block/fail before mock-upstream or the gateway have real traffic
    # to serve. Set true only once you are ready to trigger a run.
    enabled: false
    requests: 1000
    concurrency: 50
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 1Gi
