{{- if and .Values.loadtest.enabled .Values.loadtest.loadgen.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "omg.fullname" . }}-loadgen
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omg.labels" . | nindent 4 }}
    app.kubernetes.io/component: loadtest-loadgen
  annotations:
    # Not a Helm hook: this Job is a manual P8 trigger, run with
    # `helm template ... | kubectl apply -f-` or `kubectl create job
    # --from=job/...` once mock-upstream and the gateway are ready.
    omg.io/manual-trigger: "true"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "omg.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: loadtest-loadgen
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: "{{ .Values.loadtest.image.repository }}{{ if .Values.loadtest.image.digest }}@{{ .Values.loadtest.image.digest }}{{ else }}:{{ .Values.loadtest.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.loadtest.image.pullPolicy }}
          command: ["/usr/local/bin/loadgen"]
          args:
            - "run"
            - "--target"
            - "http://{{ include "omg.fullname" . }}:{{ .Values.service.port }}"
            - "--mock-url"
            - "http://{{ include "omg.fullname" . }}-mock-upstream:8000"
            - "--rate"
            - {{ .Values.loadtest.loadgen.rate | quote }}
            - "--duration"
            - {{ .Values.loadtest.loadgen.duration | quote }}
            - "--warmup"
            - {{ .Values.loadtest.loadgen.warmup | quote }}
            - "--keys"
            - {{ .Values.loadtest.loadgen.keys | quote }}
            {{- range .Values.loadtest.loadgen.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if .Values.cnpg.cluster.enabled }}
          # Read-only settlement verification (nonce matching, no double charge,
          # holds settled) as the runtime role, on the primary. The URL is built
          # in-pod from the role Secret; no password is rendered.
          env:
            {{- include "omg.cnpg.roleCredEnv" (dict "role" .Values.cnpg.cluster.roles.runtime "prefix" "OMG_DB_VERIFY") | nindent 12 }}
            - name: LOADGEN_VERIFY_DATABASE_URL
              value: {{ include "omg.cnpg.url" (dict "prefix" "OMG_DB_VERIFY" "host" (printf "%s-rw" (include "omg.cnpg.clusterName" .)) "db" .Values.cnpg.cluster.database "sslmode" .Values.cnpg.cluster.sslMode) | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.loadtest.loadgen.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
{{- end }}
