{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "omg.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omg.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "omg.gatewaySelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "omg.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omg.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "omg.gatewaySelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingress.fromNamespace }}
          {{- with .Values.networkPolicy.ingress.fromPodLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
    {{- if .Values.networkPolicy.ingress.metrics.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingress.metrics.fromNamespace }}
          {{- with .Values.networkPolicy.ingress.metrics.fromPodLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - { protocol: TCP, port: 9464 }
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "omg.fullname" . }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omg.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "omg.gatewaySelectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- if .Values.networkPolicy.egress.dns }}
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- end }}
    {{- if .Values.cnpg.cluster.enabled }}
    # Direct to the CNPG Cluster (LISTEN, reporting replica) and the Pooler.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "omg.cnpg.clusterName" . }}
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: {{ include "omg.cnpg.poolerName" . }}
      ports:
        - { protocol: TCP, port: 5432 }
    {{- else }}
    # External database/pooler: no in-cluster pod selector is known, so
    # 5432/6432 stay open installation-wide; tighten with extraEgress below
    # (for example a podSelector/ipBlock scoped to the database host) if your
    # CNI supports it.
    - ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6432 }
    {{- end }}
    {{- if .Values.networkPolicy.egress.allowHttpsEgress }}
    # OIDC issuer, provider APIs and S3-compatible file stores on 443. The
    # gateway's own egress policy (GATEWAY_EGRESS_PRIVATE_ALLOW, #33) already
    # refuses metadata, link-local and unlisted private addresses; httpsCidrs
    # narrows the network layer to match (FQDN rules need Cilium/Calico
    # Enterprise). SMTP (587/465/25) is not opened here: use extraEgress.
    {{- $cidrs := .Values.networkPolicy.egress.httpsCidrs | default list }}
    {{- $except := .Values.networkPolicy.egress.httpsExceptCidrs | default list }}
    {{- if and $cidrs $except }}
    {{- fail "networkPolicy.egress.httpsExceptCidrs applies only when httpsCidrs is empty (an exception must lie inside its CIDR); leave the excluded ranges out of httpsCidrs instead" }}
    {{- end }}
    - ports:
        - { protocol: TCP, port: 443 }
      {{- if $cidrs }}
      to:
        {{- range $cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      {{- else if $except }}
      # Anywhere except these, per address family.
      to:
        {{- range (list "0.0.0.0/0" "::/0") }}
        {{- $all := . }}
        - ipBlock:
            cidr: {{ $all | quote }}
            {{- $matching := list }}
            {{- range $except }}
            {{- if eq (contains ":" .) (contains ":" $all) }}
            {{- $matching = append $matching . }}
            {{- end }}
            {{- end }}
            {{- with $matching }}
            except:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- range .Values.networkPolicy.egress.extraEgress }}
    - {{ toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
