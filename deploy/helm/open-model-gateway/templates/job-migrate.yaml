{{- if .Values.migrations.run }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "omg.fullname" . }}-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omg.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  {{- if not .Release.IsInstall }}
  # Upgrades migrate before any new gateway pod starts. A first install runs
  # this Job as a plain resource instead (a pre-install hook would run before
  # the chart's CNPG Cluster exists); gateway pods wait for the schema.
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "omg.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # AGENTS.md: a separate migrator Secret, mounted only here (and a
      # future cronjob-partitions), never in the gateway Deployment. The
      # migrator connects directly (never through the transaction-mode
      # Pooler): session-level advisory locks and DDL need a plain session.
      initContainers:
        - name: wait-for-database
          image: {{ include "omg.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["wait-for-database"]
          env:
            {{- include "omg.env.migratorDatabase" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
        - name: migrate
          image: {{ include "omg.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "omg.env.migratorDatabase" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        # Same image, same migrator Secret: the reviewed runtime grants are
        # embedded in the binary (deploy/staging/runtime-grants.sql).
        - name: apply-runtime-grants
          image: {{ include "omg.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["grants", "apply"]
          env:
            {{- include "omg.env.migratorDatabase" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
{{- end }}
