{{- if .Values.cnpg.cluster.enabled }}
{{- $migrator := .Values.cnpg.cluster.roles.migrator }}
{{- $runtime := .Values.cnpg.cluster.roles.runtime }}
{{- if not $migrator.existingSecret }}{{ fail "cnpg.cluster.roles.migrator.existingSecret is required when cnpg.cluster.enabled is true (a pre-created kubernetes.io/basic-auth Secret)" }}{{- end }}
{{- if not $runtime.existingSecret }}{{ fail "cnpg.cluster.roles.runtime.existingSecret is required when cnpg.cluster.enabled is true (a pre-created kubernetes.io/basic-auth Secret)" }}{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "omg.cnpg.clusterName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omg.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cnpg.cluster.instances }}
  imageName: {{ .Values.cnpg.cluster.image }}
  minSyncReplicas: {{ .Values.cnpg.cluster.minSyncReplicas }}
  maxSyncReplicas: {{ .Values.cnpg.cluster.maxSyncReplicas }}
  smartShutdownTimeout: {{ .Values.cnpg.cluster.smartShutdownTimeout }}
  storage:
    storageClass: {{ .Values.cnpg.cluster.storageClass }}
    size: {{ .Values.cnpg.cluster.storageSize }}
  walStorage:
    storageClass: {{ .Values.cnpg.cluster.storageClass }}
    size: {{ .Values.cnpg.cluster.walStorageSize }}
  resources:
    {{- toYaml .Values.cnpg.cluster.resources | nindent 4 }}
  bootstrap:
    initdb:
      database: {{ .Values.cnpg.cluster.database }}
      owner: {{ $migrator.name }}
      # Never chart-generated: the operator pre-creates this basic-auth
      # Secret, so CNPG uses it as-is instead of minting new credentials.
      secret:
        name: {{ $migrator.existingSecret }}
  # A CNPG managed role for gateway_runtime, backed by its own pre-created
  # Secret. The runtime role gets no superuser/createdb/createrole/login-DDL
  # attribute here; its actual table/column privileges come only from
  # deploy/staging/runtime-grants.sql, applied by the migration Job
  # (AGENTS.md "explicit table/column ACLs, never owner credentials").
  managed:
    roles:
      - name: {{ $runtime.name }}
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: {{ $runtime.existingSecret }}
  postgresql:
    parameters:
      {{- range $key, $value := .Values.cnpg.cluster.postgresql.parameters }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
  affinity:
    podAntiAffinityType: {{ if .Values.cnpg.cluster.additionalPodAntiAffinity }}required{{ else }}preferred{{ end }}
    topologyKey: kubernetes.io/hostname
    {{- with .Values.cnpg.cluster.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- $backup := .Values.cnpg.cluster.backup }}
  {{- if $backup.enabled }}
  {{- if eq $backup.method "plugin" }}
  plugins:
    - name: {{ $backup.plugin.name | default "barman-cloud.cloudnative-pg.io" }}
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "omg.cnpg.backupObjectStoreName" . }}
  {{- else if eq $backup.method "barmanObjectStore" }}
  backup:
    barmanObjectStore:
      {{- toYaml $backup.barmanObjectStore | nindent 6 }}
  {{- else }}
  {{- fail (printf "cnpg.cluster.backup.method must be \"barmanObjectStore\" or \"plugin\", got %q" $backup.method) }}
  {{- end }}
  {{- end }}
{{- if $backup.enabled }}
{{- if eq $backup.method "plugin" }}
{{- $store := $backup.plugin.objectStore }}
---
# The Barman Cloud plugin's ObjectStore (barmancloud.cnpg.io/v1), referenced
# by the Cluster's plugins[].parameters.barmanObjectName above. Credentials
# are Secret references only, read by the plugin sidecar at runtime; this
# chart never generates or stores the Secret itself.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ include "omg.cnpg.backupObjectStoreName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omg.labels" . | nindent 4 }}
spec:
  {{- with $store.retentionPolicy }}
  retentionPolicy: {{ . | quote }}
  {{- end }}
  configuration:
    destinationPath: {{ required "cnpg.cluster.backup.plugin.objectStore.destinationPath is required when cnpg.cluster.backup.method is \"plugin\"" $store.destinationPath }}
    {{- with $store.endpointURL }}
    endpointURL: {{ . }}
    {{- end }}
    s3Credentials:
      accessKeyId:
        name: {{ required "cnpg.cluster.backup.plugin.objectStore.s3Credentials.accessKeyId.name is required when cnpg.cluster.backup.method is \"plugin\"" (dig "accessKeyId" "name" "" ($store.s3Credentials | default dict)) }}
        key: {{ required "cnpg.cluster.backup.plugin.objectStore.s3Credentials.accessKeyId.key is required when cnpg.cluster.backup.method is \"plugin\"" (dig "accessKeyId" "key" "" ($store.s3Credentials | default dict)) }}
      secretAccessKey:
        name: {{ required "cnpg.cluster.backup.plugin.objectStore.s3Credentials.secretAccessKey.name is required when cnpg.cluster.backup.method is \"plugin\"" (dig "secretAccessKey" "name" "" ($store.s3Credentials | default dict)) }}
        key: {{ required "cnpg.cluster.backup.plugin.objectStore.s3Credentials.secretAccessKey.key is required when cnpg.cluster.backup.method is \"plugin\"" (dig "secretAccessKey" "key" "" ($store.s3Credentials | default dict)) }}
    {{- with $store.wal }}
    wal:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $store.data }}
    data:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with $store.instanceSidecarConfiguration }}
  instanceSidecarConfiguration:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "omg.cnpg.clusterName" . }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omg.labels" . | nindent 4 }}
spec:
  schedule: {{ $backup.scheduledBackup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ include "omg.cnpg.clusterName" . }}
  {{- if eq $backup.method "plugin" }}
  method: plugin
  pluginConfiguration:
    name: {{ $backup.plugin.name | default "barman-cloud.cloudnative-pg.io" }}
  {{- end }}
{{- end }}
{{- end }}
