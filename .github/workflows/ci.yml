name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Only superseded PR work is cancelled. Unique main/tag groups also prevent
# GitHub from replacing a pending release run in the same concurrency group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# No Docker Hub pulls: Docker Hub's anonymous pull limit on shared runners and
# its outages failed builds. Official images come from mirror.gcr.io (Google's
# Docker Hub mirror, same digests), other images from their vendor's registry,
# and tools from checksum-verified release binaries (docs/verification.md).
#
# Third-party actions and run-time downloads get read-only tokens (#194): no job here
# can write except `image`, which calls image.yml, whose write jobs use only the
# allowlist in tests/supply-chain.test.mjs. Node, helm and kubeconform are pinned
# releases fetched by .github/scripts/fetch-verified.sh, which checks a SHA-256
# written in the workflow (.github/actions/setup-node, the helm job).

jobs:
  gateway-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # 1.99.1, matches rust-toolchain.toml
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  gateway-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gateway:gateway@localhost:5432/gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # 1.99.1, matches rust-toolchain.toml
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/setup-node
      - run: npm ci
      # Split the large gateway library by exact names; other test targets stay
      # whole. The script reconciles Cargo's metadata/artifacts and test counts.
      # Docker/ACL probes belong exclusively to gateway-special; docs to shard 0.
      - run: node .github/scripts/rust-shards.mjs --shard ${{ matrix.shard }} --count 4

  gateway-special:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gateway:gateway@localhost:5432/gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exact version from rust-toolchain.toml, not the floating 'stable' channel (#354);
      # tests/supply-chain.test.mjs fails if this ever disagrees with that file or the Dockerfile.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # 1.99.1, matches rust-toolchain.toml
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/setup-node
      - run: npm ci
      - name: S3-compatible file store against MinIO and RustFS containers
        # Images are pinned by digest in tests/filestore_s3.rs; random loopback ports;
        # containers are removed by the test. Missing Docker fails instead of skipping.
        env:
          FILESTORE_REQUIRE_DOCKER: "1"
        run: cargo test -p open-model-gateway --all-features --test filestore_s3
      - name: Ordinary runtime privilege tests on disposable PostgreSQL
        run: cargo test -p open-model-gateway --all-features --test runtime_privileges
      - name: Verify enterprise runtime ACLs on disposable PostgreSQL
        run: cargo test -p open-model-gateway --all-features --test runtime_privileges -- --ignored --test-threads=1
      - name: Measure key issuance contention on dedicated runtime-role PostgreSQL
        # Changes maintenance ACLs; serialize after runtime_privileges, not an ignored sweep.
        env:
          RUST_TEST_NOCAPTURE: "1"
        run: cargo test -p open-model-gateway --all-features --lib management::tests::authz_matrix_tests::key_issuance_contention_tests::key_issuance_contention_measurement -- --ignored --exact
      - name: Verify Anthropic terminal SDK and accounting contract on disposable PostgreSQL
        # Changes maintenance-database ACLs: run sequentially, never as a generic ignored-test sweep.
        run: cargo test -p open-model-gateway --all-features --lib providers::anthropic::terminal_tests::terminal_fidelity_official_sdks_and_priced_http_evidence -- --ignored --exact
      - name: Install age for the encrypted backup tests
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Build the gateway binary for the backup lineage check
        run: cargo build -p open-model-gateway --all-features --bin open-model-gateway
      - name: Backup/restore drill on the disposable service database
        # PostgreSQL 17 client tools run inside the service container; the
        # lineage check uses the explicitly built gateway binary above.
        env:
          BACKUP_TEST_DATABASE_URL: postgres://gateway:gateway@127.0.0.1:5432/gateway
          BACKUP_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          BACKUP_TEST_GATEWAY_BINARY: target/debug/open-model-gateway
        run: python3 tests/backup.test.py

  # Stable protected-branch check name. The matrix needs result covers every leg;
  # skipped, cancelled, missing or additional dependencies must not turn green.
  gateway:
    runs-on: ubuntu-latest
    needs: [gateway-lint, gateway-tests, gateway-special]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: node .github/scripts/gateway-result.mjs
        env:
          GATEWAY_NEEDS: ${{ toJSON(needs) }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run test:sdk-bases
      - run: npm run test:demo
      - run: npm run test:supply-chain
      - run: npm run test:ci
      - run: npm run test:conflict-markers
      - name: Install age (test:staging includes the encrypted backup tests)
        run: sudo apt-get update && sudo apt-get install -y age
      - run: npm run test:staging
      - run: npm run build:web

  # Supply chain (docs/verification.md): cargo-deny over the Rust graph
  # (RustSec advisories, licences, bans, sources; policy in deny.toml) and
  # npm audit of the production dependencies. Actions pinned by commit SHA.
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Prebuilt, checksum-verified binary instead of the Docker-based
      # cargo-deny action (which pulls its image from Docker Hub).
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --all-features check
      - uses: ./.github/actions/setup-node
      - name: Verify vendored advisory coverage (offline synthetic database)
        run: node --test tests/vendored-advisories.test.mjs
      - name: Vendored upstream-base advisories only (temporary metadata projection)
        run: node .github/scripts/vendored-advisories.mjs

  # Helm chart (deploy/helm/open-model-gateway, scale plan P7): lint and
  # render every values profile, kubeconform-validate the rendered output,
  # and run the rendered-output assertions in tests/helm-chart.test.mjs.
  # No cluster is created; no Docker Hub pulls (kubeconform's own release
  # binary and SHA-pinned actions only).
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      # helm's own release binary and kubeconform's release binary (neither is in
      # taiki-e/install-action's manifest), pinned by version and fetched by the
      # checksum-verifying script. The helm SHA-256 is the one published beside it
      # (get.helm.sh/helm-v3.18.4-linux-amd64.tar.gz.sha256sum), kubeconform's is in
      # its release CHECKSUMS. azure/setup-helm downloads without any check.
      - name: Install helm (checksum-verified)
        run: |
          set -euo pipefail
          bash .github/scripts/fetch-verified.sh https://get.helm.sh/helm-v3.18.4-linux-amd64.tar.gz f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1 "${RUNNER_TEMP}/helm.tar.gz"
          tar -xzf "${RUNNER_TEMP}/helm.tar.gz" -C "${RUNNER_TEMP}" linux-amd64/helm
          sudo mv "${RUNNER_TEMP}/linux-amd64/helm" /usr/local/bin/helm
          helm version --short
      - name: Install kubeconform (checksum-verified)
        run: |
          set -euo pipefail
          bash .github/scripts/fetch-verified.sh https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3 "${RUNNER_TEMP}/kubeconform.tar.gz"
          tar -xzf "${RUNNER_TEMP}/kubeconform.tar.gz" -C "${RUNNER_TEMP}" kubeconform
          sudo mv "${RUNNER_TEMP}/kubeconform" /usr/local/bin/kubeconform
      - run: helm lint deploy/helm/open-model-gateway
      - run: helm lint deploy/helm/open-model-gateway -f deploy/helm/open-model-gateway/ci/external-db-values.yaml
      - run: helm lint deploy/helm/open-model-gateway -f deploy/helm/open-model-gateway/ci/cnpg-values.yaml
      - run: helm lint deploy/helm/open-model-gateway -f deploy/helm/open-model-gateway/ci/loadtest-values.yaml
      - name: Render and kubeconform-validate every profile
        run: |
          set -euo pipefail
          for profile in external-db cnpg loadtest; do
            extra=()
            [ "$profile" = "loadtest" ] || extra=(--set migrations.run=true)
            helm template omg-ci deploy/helm/open-model-gateway \
              -f "deploy/helm/open-model-gateway/ci/${profile}-values.yaml" "${extra[@]}" \
              > "/tmp/render-${profile}.yaml"
            kubeconform -strict -summary -kubernetes-version 1.36.0 -ignore-missing-schemas \
              "/tmp/render-${profile}.yaml"
          done
      - run: node --test tests/helm-chart.test.mjs

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      # Gate: high/critical advisories in production dependencies (the SPA
      # bundle) fail the job. Reads package-lock.json; no install needed.
      - name: npm audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high
      # Non-blocking: every advisory, dev tooling included, in the summary.
      - name: npm audit summary (all dependencies, non-blocking)
        if: always()
        run: |
          {
            echo "## npm audit (all dependencies)"
            echo
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  browser:
    # Playwright (Chromium) against the real gateway binary + built SPA, a disposable
    # database, the local signed-OIDC issuer and a mock upstream. No paid providers.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OMG_BROWSER_ADMIN_DATABASE_URL: postgres://gateway:gateway@localhost:5432/gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exact version from rust-toolchain.toml, not the floating 'stable' channel (#354);
      # tests/supply-chain.test.mjs fails if this ever disagrees with that file or the Dockerfile.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # 1.99.1, matches rust-toolchain.toml
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/setup-node
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: |
            target/browser-tests/results
            target/browser-tests/report
            target/browser-tests/gateway.log
          retention-days: 7

  # The independent, read-only staging rehearsal builds/verifies its own image
  # for pull requests. On main and v* tags image runs the same rehearsal on
  # the exact digests it publishes, so this job is skipped there.
  staging-image:
    if: github.event_name != 'push' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Approved staging rehearsal digest pins; same mirror defaults as Compose.
      STAGING_POSTGRES_IMAGE: mirror.gcr.io/library/postgres@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
      STAGING_CADDY_IMAGE: mirror.gcr.io/library/caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit from mirror.gcr.io instead of Docker Hub.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: open-model-gateway:staging
          cache-from: type=gha,scope=staging
          cache-to: type=gha,mode=max,scope=staging
      - name: Migrate and verify isolated runtime authority over HTTPS
        run: |
          python3 scripts/staging.py init
          python3 scripts/staging.py db
          python3 scripts/staging.py migrate
          python3 scripts/staging.py up
          python3 scripts/staging.py verify
          python3 scripts/staging.py local-ca
          curl --fail --silent --show-error --cacert .local/staging/local-ca.crt https://localhost:18443/health/ready
          python3 scripts/staging.py restore-check
      - name: Stop isolated staging (retain volumes; runner is disposable)
        if: always()
        run: python3 scripts/staging.py down
      # Distroless runtime contract on the same image: no shell/package manager,
      # UID 10001, read-only rootfs, _FILE secrets, serve never migrates,
      # exec-form healthcheck.
      - uses: ./.github/actions/setup-node
      - name: Runtime image contract
        env:
          OMG_CONTAINER_IMAGE: open-model-gateway:staging
        run: npm run test:container

  # Multi-arch image (linux/amd64, linux/arm64): built and pushed by digest in a
  # write job with no third-party tooling, then tested in read-only jobs (staging
  # rehearsal of each pushed digest, runtime contract, Trivy scan), and only then
  # tagged and signed with cosign; SBOM and provenance; the GitHub Release for v*
  # tags. On pushes to main and v* tags once the tests pass
  # (.github/workflows/image.yml).
  image:
    needs: [gateway, web, browser]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write # the release job (v* tags only) creates the GitHub Release
      packages: write
      id-token: write
    uses: ./.github/workflows/image.yml
