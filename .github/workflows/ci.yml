name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gateway:gateway@localhost:5432/gateway
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The MinIO/RustFS file store tests run in their own step below.
      - run: cargo test --workspace --all-features -- --skip minio_compatibility --skip rustfs_compatibility
      - name: S3-compatible file store against MinIO and RustFS containers
        # Images are pinned by digest in tests/filestore_s3.rs; random loopback ports;
        # containers are removed by the test. Missing Docker fails instead of skipping.
        env:
          FILESTORE_REQUIRE_DOCKER: "1"
        run: cargo test -p open-model-gateway --all-features --test filestore_s3
      - name: Verify enterprise runtime ACLs on disposable PostgreSQL
        run: cargo test -p open-model-gateway --all-features --test runtime_privileges -- --ignored
      - name: Backup/restore drill on the disposable service database
        # PostgreSQL 17 client tools run inside the service container; the
        # lineage check uses the gateway binary built by the tests above.
        env:
          BACKUP_TEST_DATABASE_URL: postgres://gateway:gateway@127.0.0.1:5432/gateway
          BACKUP_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          BACKUP_TEST_GATEWAY_BINARY: target/debug/open-model-gateway
        run: python3 tests/backup.test.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run test:demo
      - run: npm run test:staging
      - run: npm run build:web

  # Supply chain (docs/verification.md): cargo-deny over the Rust graph
  # (RustSec advisories, licences, bans, sources; policy in deny.toml) and
  # npm audit of the production dependencies. Actions pinned by commit SHA.
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          command: check
          arguments: --all-features

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      # Gate: high/critical advisories in production dependencies (the SPA
      # bundle) fail the job. Reads package-lock.json; no install needed.
      - name: npm audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high
      # Non-blocking: every advisory, dev tooling included, in the summary.
      - name: npm audit summary (all dependencies, non-blocking)
        if: always()
        run: |
          {
            echo "## npm audit (all dependencies)"
            echo
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  browser:
    # Playwright (Chromium) against the real gateway binary + built SPA, a disposable
    # database, the local signed-OIDC issuer and a mock upstream. No paid providers.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OMG_BROWSER_ADMIN_DATABASE_URL: postgres://gateway:gateway@localhost:5432/gateway
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-results
          path: |
            target/browser-tests/results
            target/browser-tests/report
            target/browser-tests/gateway.log
          retention-days: 7

  # The isolated staging rehearsal on a locally built image, for pull requests
  # and branches. On main and v* tags the image job runs the same rehearsal on
  # the exact digests it publishes, so this job is skipped there.
  staging-image:
    if: github.event_name != 'push' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [gateway, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: open-model-gateway:staging
          cache-from: type=gha,scope=staging
          cache-to: type=gha,mode=max,scope=staging
      - name: Migrate and verify isolated runtime authority over HTTPS
        run: |
          python3 scripts/staging.py init
          python3 scripts/staging.py db
          python3 scripts/staging.py migrate
          python3 scripts/staging.py up
          python3 scripts/staging.py verify
          python3 scripts/staging.py local-ca
          curl --fail --silent --show-error --cacert .local/staging/local-ca.crt https://localhost:18443/health/ready
          python3 scripts/staging.py restore-check
      - name: Stop isolated staging (retain volumes; runner is disposable)
        if: always()
        run: python3 scripts/staging.py down
      # Distroless runtime contract on the same image: no shell/package manager,
      # UID 10001, read-only rootfs, _FILE secrets, serve never migrates,
      # exec-form healthcheck.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Runtime image contract
        env:
          OMG_CONTAINER_IMAGE: open-model-gateway:staging
        run: npm run test:container

  # Multi-arch image (linux/amd64, linux/arm64): staging rehearsal of each
  # pushed digest, Trivy scan, SBOM and provenance, cosign signature, and the
  # GitHub Release for v* tags. On pushes to main and v* tags once the tests
  # pass (.github/workflows/image.yml).
  image:
    needs: [gateway, web, browser]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write # the release job (v* tags only) creates the GitHub Release
      packages: write
      id-token: write
    uses: ./.github/workflows/image.yml
