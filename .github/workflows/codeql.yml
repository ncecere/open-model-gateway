# CodeQL code scanning for the SPA/test tooling (javascript-typescript) and
# the gateway (rust). Both languages use build-mode none: CodeQL extracts
# the source without a build (Rust is supported in this mode). Results go
# to the repository's Security tab (docs/verification.md, "Supply chain").
#
# Every action is pinned by commit SHA; the comment gives the version.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 5 * * 1" # weekly, Monday 05:27 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write # upload code scanning results
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
