# CodeQL code scanning for the SPA/test tooling (javascript-typescript) and
# the gateway (rust). Both languages use build-mode none: CodeQL extracts
# the source without a build (Rust is supported in this mode). Results go
# to the repository's Security tab (docs/verification.md, "Supply chain").
#
# Two jobs, because init and analyze download the CodeQL bundle at run time (an
# executable that is not pinned by a checksum of ours) and a job that can write must
# not run that (#194):
#   analyze  contents: read only. Runs init and analyze with the upload turned off and
#            hands the SARIF files on as an artifact.
#   upload   security-events: write. Runs only github/codeql-action/upload-sarif (plus
#            checkout and download-artifact), which sends the SARIF files and downloads
#            no bundle.
#
# Every action is pinned by commit SHA; the comment gives the version.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 5 * * 1" # weekly, Monday 05:27 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: never # the upload job sends the results
          upload-database: false # nothing here can write
          output: sarif-results

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: error
          retention-days: 1

  upload:
    name: upload (${{ matrix.language }})
    needs: [analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload code scanning results
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sarif-${{ matrix.language }}
          path: sarif-results

      # Exactly one regular .sarif file, passed by name: given a directory with
      # several CodeQL files, upload-sarif merges them, and merging initializes
      # (downloads) the CodeQL bundle in this write job. A compromised analyze job
      # must not be able to trigger that.
      - name: One SARIF file
        id: sarif
        run: |
          set -euo pipefail
          mapfile -t found < <(find sarif-results -mindepth 1)
          if [ "${#found[@]}" -ne 1 ] || [ ! -f "${found[0]}" ] || [ -L "${found[0]}" ] || [[ "${found[0]}" != *.sarif ]]; then
            echo "::error::expected exactly one regular .sarif file, found: ${found[*]:-none}"
            exit 1
          fi
          echo "file=${found[0]}" >> "$GITHUB_OUTPUT"

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ steps.sarif.outputs.file }}
          category: /language:${{ matrix.language }}
