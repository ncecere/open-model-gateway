# Load-test image for a cluster capacity run (docs/kubernetes.md "Loadtest profile (P8)"):
# ghcr.io/ncecere/open-model-gateway-loadtest:dev-<first 12 characters of the commit>, built from
# deploy/loadtest/Dockerfile (the gateway, the mock upstream and the load generator).
#
# Built only on request (a run is long and rare): Actions › loadtest-image › Run workflow, or
# `gh workflow run loadtest-image.yml -f ref=<branch|tag|commit>`. Like branch-images.yml it is a
# development build: linux/amd64, no latest or version tag, not scanned or signed, never a
# production image. prune-dev-images.yml deletes old dev-<12 hex> tags of this package too.
name: loadtest-image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (default is the selected ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: loadtest-image-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build open-model-gateway-loadtest
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Name the image
        id: name
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          {
            echo "sha=$sha"
            echo "tag=dev-${sha:0:12}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/open-model-gateway-loadtest"
          } >> "$GITHUB_OUTPUT"

      # setup-buildx-action downloads the latest Buildx, unchecked, when the runner has
      # none. This job can write, so fail here instead; the action's `version` input
      # (which also downloads) stays unset. tests/supply-chain.test.mjs enforces both.
      - name: Require the runner's own Buildx
        run: docker buildx version

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit from mirror.gcr.io instead of Docker Hub.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/loadtest/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}
          build-args: CARGO_BUILD_JOBS=4
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.title=open-model-gateway-loadtest
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.name.outputs.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=loadtest-linux-amd64
          cache-to: type=gha,mode=max,scope=loadtest-linux-amd64

      - name: Summary
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAG: ${{ steps.name.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "\`$IMAGE:$TAG\`"
            echo ""
            echo "digest \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
