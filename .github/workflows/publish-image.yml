name: Publish staging image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            open-model-gateway:staging
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=staging
      - name: Verify the exact image before publication (no real credentials)
        run: |
          python3 scripts/staging.py init
          python3 scripts/staging.py db
          python3 scripts/staging.py migrate
          python3 scripts/staging.py up
          python3 scripts/staging.py verify
          python3 scripts/staging.py local-ca
          curl --fail --silent --show-error --cacert .local/staging/local-ca.crt https://localhost:18443/health/ready
          python3 scripts/staging.py restore-check
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image, tagged by full commit SHA
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          docker push "$IMAGE"
          docker inspect --format='{{join .RepoDigests "\n"}}' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop isolated staging
        if: always()
        run: python3 scripts/staging.py down
