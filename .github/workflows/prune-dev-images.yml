# Deletes old development images (branch-images.yml's dev-<12 hex> tags) from the GHCR packages.
#
# Only a version whose tags are ALL dev-<12 hex digits> is ever a candidate. Untagged versions are
# never touched (the per-architecture children of a release's multi-platform index are untagged), and
# neither is any version that carries another tag (a release, sha-<short>, latest...).
#
# Runs weekly and deletes images older than 14 days. By hand it is a dry run unless you clear dry_run.
name: prune-dev-images

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      older_than_days:
        description: Delete development images older than this many days
        required: false
        default: '14'
        type: string
      dry_run:
        description: Only list what would be deleted
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: prune-dev-images
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      # URL-encoded package names, one per line
      PACKAGES: |
        open-model-gateway
        open-model-gateway-loadtest
      OLDER_THAN_DAYS: ${{ inputs.older_than_days || '14' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - name: Prune
        run: |
          set -euo pipefail
          [[ "$OLDER_THAN_DAYS" =~ ^[0-9]+$ ]] || { echo "::error::older_than_days must be a number"; exit 1; }
          cutoff="$(date -u -d "$OLDER_THAN_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)"
          echo "Development images created before $cutoff (dry run: $DRY_RUN)"
          deleted=0
          while read -r package; do
            [ -n "$package" ] || continue
            echo "## $package"
            versions="$(gh api --paginate "/users/$OWNER/packages/container/$package/versions?per_page=100" | jq -s 'add // []')"
            # candidates: tagged, every tag is dev-<12 hex>, older than the cutoff
            ids="$(jq -r --arg cutoff "$cutoff" '
              .[] | select((.metadata.container.tags | length) > 0)
                  | select(all(.metadata.container.tags[]; test("^dev-[0-9a-f]{12}$")))
                  | select(.created_at < $cutoff)
                  | "\(.id) \(.metadata.container.tags | join(","))"' <<<"$versions")"
            total="$(jq 'length' <<<"$versions")"
            echo "$total versions in the package"
            while read -r id tags; do
              [ -n "${id:-}" ] || continue
              if [ "$DRY_RUN" = true ]; then
                echo "would delete $id ($tags)"
              else
                gh api -X DELETE "/users/$OWNER/packages/container/$package/versions/$id"
                echo "deleted $id ($tags)"
              fi
              deleted=$((deleted + 1))
            done <<<"$ids"
          done <<<"$PACKAGES"
          echo "candidates: $deleted (dry run: $DRY_RUN)" | tee -a "$GITHUB_STEP_SUMMARY"
