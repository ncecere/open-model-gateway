\* DIAGNOSTIC, expected to FAIL: a received complete usage report does not
\* always end `settled` (cost-accuracy gap, not a money-safety violation).
SPECIFICATION Spec
CONSTANTS
  Attempts = {1, 2}
  Replicas = {r1, r2}
  Serving = r1
  HOLD = 2
  ACTUAL = 1
  MaxCrashes = 1
  Mut = "none"
INVARIANTS KnownUsageSettled
CHECK_DEADLOCK FALSE
