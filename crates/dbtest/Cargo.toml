[package]
name = "dbtest"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
license = "MIT"
description = "Test attribute for PostgreSQL tests that start from a pre-migrated template database"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
