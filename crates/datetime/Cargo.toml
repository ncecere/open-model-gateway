[package]
name = "gateway-datetime-compat"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
license = "MIT"

[features]
default = []
sqlx = ["dep:sqlx"]
postgres-tests = ["sqlx", "dep:tokio"]

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
# Browser SDK clocks need JavaScript Date; SystemTime is unavailable there.
time = { version = "=0.3.55", default-features = false, features = ["std", "large-dates", "serde", "formatting", "parsing", "wasm-bindgen"] }

sqlx = { version = "=0.8.6", optional = true, default-features = false, features = ["postgres", "time", "runtime-tokio"] }
tokio = { version = "1", optional = true, features = ["macros", "rt"] }

[dev-dependencies]
serde_json = "=1.0.154"
