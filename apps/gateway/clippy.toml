# Direct pool begins bypass the READ COMMITTED baseline and can leave an
# untracked server-side transaction when cancelled (sqlx 0.8); see `src/db.rs`.
#
# Outbound HTTP (#509): every reqwest client starts from
# `crate::egress::client_builder` (or `pinned_client_builder` for approved
# local endpoints), which disables redirects, implicit retries and ambient
# proxies and checks every resolved address. Any other constructor, and any
# builder method that changes destination, proxy, redirect, retry, DNS or TLS
# trust, is rejected outside `src/egress.rs`. Clippy resolves these paths by
# name resolution, so aliases, re-exports (`openidconnect::reqwest`) and
# renamed imports are covered.
#
# Randomness (#511): every secret, nonce and token is drawn through
# `crate::entropy` (the OS CSPRNG, failing closed). The entropy source scan
# (`entropy.rs` tests) finds generators by name (`rand`, `OsRng`, ...); the
# library calls below draw randomness without such a name, so they are
# refused here by path. `apps/gateway/src/entropy.rs` keeps this list in
# step with its CLIPPY_LIST and pins the named crates' versions in
# Cargo.lock, so a bump forces a review (`allow-invalid` is silent).
# `Uuid::new_v4`/`now_v7`/`new_v7` and SQL `gen_random_uuid()` stay
# allowed: identifiers and fencing values only, never a secret
# (docs/threat-model.md KEY-10).
disallowed-methods = [
  { path = "sqlx::Pool::begin", reason = "use crate::db::begin (cancellation-safe)" },
  { path = "sqlx::Pool::begin_with", reason = "use crate::db::begin_with_setup (cancellation-safe)" },
  { path = "reqwest::Client::new", reason = "build HTTP clients with crate::egress::client_builder (#509)" },
  { path = "reqwest::Client::builder", reason = "build HTTP clients with crate::egress::client_builder (#509)" },
  { path = "reqwest::ClientBuilder::new", reason = "build HTTP clients with crate::egress::client_builder (#509)" },
  { path = "reqwest::get", reason = "send requests with a client from crate::egress::client_builder (#509)" },
  { path = "reqwest::ClientBuilder::redirect", reason = "crate::egress::client_builder disables redirects (#509)" },
  { path = "reqwest::ClientBuilder::retry", reason = "crate::egress::client_builder disables implicit retries (#509)" },
  { path = "reqwest::ClientBuilder::proxy", reason = "crate::egress::client_builder disables proxies (#509)" },
  { path = "reqwest::ClientBuilder::no_proxy", reason = "only crate::egress::client_builder sets proxy behaviour (#509)" },
  { path = "reqwest::ClientBuilder::dns_resolver", reason = "crate::egress::client_builder sets the egress resolver (#509)" },
  { path = "reqwest::ClientBuilder::dns_resolver2", reason = "crate::egress::client_builder sets the egress resolver (#509)" },
  { path = "reqwest::ClientBuilder::resolve", reason = "pinned destinations use crate::egress::pinned_client_builder (#509)" },
  { path = "reqwest::ClientBuilder::resolve_to_addrs", reason = "pinned destinations use crate::egress::pinned_client_builder (#509)" },
  { path = "reqwest::ClientBuilder::connector_layer", reason = "a connector layer can bypass crate::egress::client_builder's safeguards (#509)" },
  { path = "reqwest::ClientBuilder::unix_socket", reason = "a socket path bypasses crate::egress::client_builder's resolver (#509)" },
  { path = "reqwest::ClientBuilder::windows_named_pipe", reason = "a pipe path bypasses crate::egress::client_builder's resolver (#509)", allow-invalid = true },
  { path = "reqwest::ClientBuilder::danger_accept_invalid_certs", reason = "TLS verification stays on; see crate::egress::client_builder (#509)" },
  { path = "reqwest::ClientBuilder::danger_accept_invalid_hostnames", reason = "TLS verification stays on; see crate::egress::client_builder (#509)" },
  { path = "reqwest::ClientBuilder::use_preconfigured_tls", reason = "TLS verification stays on; see crate::egress::client_builder (#509)" },
  { path = "reqwest::ClientBuilder::tls_built_in_root_certs", reason = "TLS trust changes only in crate::egress (see crate::egress::client_builder) (#509)" },
  { path = "reqwest::ClientBuilder::tls_built_in_webpki_certs", reason = "TLS trust changes only in crate::egress (see crate::egress::client_builder) (#509)" },
  { path = "reqwest::ClientBuilder::tls_built_in_native_certs", reason = "TLS trust changes only in crate::egress (see crate::egress::client_builder) (#509)", allow-invalid = true },
  { path = "reqwest::ClientBuilder::add_root_certificate", reason = "use crate::egress::add_root_certificates on a crate::egress::client_builder (#509)" },
  { path = "reqwest::ClientBuilder::hickory_dns", reason = "crate::egress::client_builder sets the egress resolver (#509)", allow-invalid = true },
  { path = "tungstenite::handshake::client::generate_key", reason = "draw secrets and nonces with crate::entropy, not tungstenite's ThreadRng (#511)" },
  { path = "rustls::crypto::SecureRandom::fill", reason = "draw secrets and nonces with crate::entropy, not the TLS provider's generator (#511)" },
  { path = "crypto_common::Generate::generate", reason = "draw keys and nonces with crate::entropy (fails closed; this panics) (#511)", allow-invalid = true },
  { path = "crypto_common::Generate::try_generate", reason = "draw secrets and nonces with crate::entropy (#511)", allow-invalid = true },
  { path = "crypto_common::Generate::generate_from_rng", reason = "draw secrets and nonces with crate::entropy (#511)", allow-invalid = true },
  { path = "crypto_common::Generate::try_generate_from_rng", reason = "draw secrets and nonces with crate::entropy (#511)", allow-invalid = true },
  { path = "crypto_common::KeyInit::generate_key", reason = "draw secrets and nonces with crate::entropy (#511)", allow-invalid = true },
  { path = "crypto_common::KeyIvInit::generate_key", reason = "draw secrets and nonces with crate::entropy (#511)", allow-invalid = true },
  { path = "crypto_common::KeyIvInit::generate_iv", reason = "draw secrets and nonces with crate::entropy (#511)", allow-invalid = true },
  { path = "crypto_common::KeyIvInit::generate_key_iv", reason = "draw secrets and nonces with crate::entropy (#511)", allow-invalid = true },
  { path = "oauth2::CsrfToken::new_random", reason = "build OAuth state with CsrfToken::new from crate::entropy (#511)" },
  { path = "oauth2::CsrfToken::new_random_len", reason = "build OAuth state with CsrfToken::new from crate::entropy (#511)" },
  { path = "oauth2::PkceCodeChallenge::new_random_sha256", reason = "build the PKCE verifier with PkceCodeVerifier::new from crate::entropy (#511)" },
  { path = "oauth2::PkceCodeChallenge::new_random_sha256_len", reason = "build the PKCE verifier with PkceCodeVerifier::new from crate::entropy (#511)" },
  { path = "oauth2::PkceCodeChallenge::new_random_plain", reason = "build the PKCE verifier with PkceCodeVerifier::new from crate::entropy (#511)", allow-invalid = true },
  { path = "openidconnect::Nonce::new_random", reason = "build the OIDC nonce with Nonce::new from crate::entropy (#511)" },
  { path = "openidconnect::Nonce::new_random_len", reason = "build the OIDC nonce with Nonce::new from crate::entropy (#511)" },
  { path = "std::hash::RandomState::new", reason = "randomly keyed hashes are not secrets; draw them with crate::entropy (#511)" },
  { path = "std::collections::HashMap::hasher", reason = "a map's RandomState is randomly keyed: use a fixed BuildHasher (BuildHasherDefault) for sharding or caches; secrets come from crate::entropy (#511)" },
  { path = "std::collections::HashSet::hasher", reason = "a set's RandomState is randomly keyed: use a fixed BuildHasher (BuildHasherDefault) for sharding or caches; secrets come from crate::entropy (#511)" },
  { path = "tower::util::rng::HasherRng::new", reason = "tower's HasherRng is RandomState-keyed: draw randomness with crate::entropy (#511)" },
  { path = "tower::util::rng::Rng::next_u64", reason = "tower's HasherRng is RandomState-keyed: draw randomness with crate::entropy (#511)" },
  { path = "tower::util::rng::Rng::next_f64", reason = "tower's HasherRng is RandomState-keyed: draw randomness with crate::entropy (#511)" },
  { path = "tower::util::rng::Rng::next_range", reason = "tower's HasherRng is RandomState-keyed: draw randomness with crate::entropy (#511)" },
  { path = "tungstenite::client::IntoClientRequest::into_client_request", reason = "it draws Sec-WebSocket-Key from tungstenite's ThreadRng: draw secrets with crate::entropy; the one handshake use is sanctioned (#511)" },
  { path = "rustls::crypto::SupportedKxGroup::start", reason = "key exchange draws from the TLS provider's generator: leave it to rustls; secrets come from crate::entropy (#511)" },
  { path = "rustls::crypto::SupportedKxGroup::start_and_complete", reason = "key exchange draws from the TLS provider's generator: leave it to rustls; secrets come from crate::entropy (#511)" },
  { path = "rustls::crypto::ring::Ticketer::new", reason = "ticket keys come from the TLS provider's generator: secrets come from crate::entropy (#511)" },
  { path = "rustls::crypto::aws_lc_rs::Ticketer::new", reason = "ticket keys come from the TLS provider's generator: secrets come from crate::entropy (#511)", allow-invalid = true },
  { path = "rustls::server::ProducesTickets::encrypt", reason = "ticket encryption draws a nonce from the TLS provider: secrets come from crate::entropy (#511)" },
]
