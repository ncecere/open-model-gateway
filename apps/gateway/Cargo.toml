[package]
name = "open-model-gateway"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[features]
default = []
integration-tests = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
aws-config = "1"
# Without the default "rustls" feature: it pulls the legacy hyper 0.14 /
# rustls 0.21 connector (unpatched h2 0.3 and rustls-webpki 0.101 advisories,
# deny.toml). Requests use the gateway's own reqwest transport (providers/bedrock/transport.rs).
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-eventstream = "=0.60.18"
aws-smithy-async = "1"
# File store (docs/file-storage.md): S3-compatible backend. Same SDK generation as
# Bedrock (shared smithy/runtime crates); request checksums "when_required" for MinIO/RustFS.
aws-sdk-s3 = { version = "=1.122.0", default-features = false, features = ["rt-tokio"] }
# Mandatory streaming AES-256-GCM encryption of every stored object.
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
base64 = "0.23"
bytes = "1"
futures = "0.3"
libc = "0.2"
zeroize = "1"
http-body = "1"
http-body-util = "0.1"
chrono = { version = "0.4", features = ["serde"] }
async-stream = "0.3"
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
hex = "0.4"
# Batch scheduling time windows (IANA zones, DST): the bundled tz database, so
# window evaluation never depends on the host's zoneinfo.
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
# SMTP delivery (invitations, alerts): rustls, async, one connection per message (no pool).
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
percent-encoding = "2"
# Prometheus/OpenMetrics exposition on the optional GATEWAY_METRICS_ADDR listener.
prometheus-client = "=0.25.1"
# Secrets come only from the OS CSPRNG (rand::rngs::SysRng, fallible; src/entropy.rs).
# No ThreadRng (it panics when the OS RNG fails); seeded StdRng only for routing's
# deterministic, non-secret weighted choice.
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng", "std_rng"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "migrate", "macros", "json", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "process", "fs", "io-util"] }
# Realtime upstream WebSocket (same tungstenite as axum's `ws`); TLS uses an explicit
# ring-backed rustls config with webpki roots; no proxies, redirects or retries.
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["limit", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tempfile = "3"
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
