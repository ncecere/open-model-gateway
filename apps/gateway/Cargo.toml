[package]
name = "open-model-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
default = []
integration-tests = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
aws-config = "1"
aws-sdk-bedrockruntime = "1"
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-eventstream = "=0.60.18"
aws-smithy-async = "1"
http-body = "1"
http-body-util = "0.1"
chrono = { version = "0.4", features = ["serde"] }
async-stream = "0.3"
futures-util = "0.3"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
hex = "0.4"
# SMTP delivery (invitations, alerts): rustls, async, one connection per message (no pool).
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
percent-encoding = "2"
# Prometheus/OpenMetrics exposition on the optional GATEWAY_METRICS_ADDR listener.
prometheus-client = "=0.25.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "migrate", "macros", "json", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "process"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
