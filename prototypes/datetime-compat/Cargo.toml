[package]
name = "gateway-datetime-compat"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT"

# Deliberately independent from the production gateway workspace.
[workspace]
resolver = "3"

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
time = { version = "=0.3.55", default-features = false, features = ["std", "large-dates", "serde", "formatting", "parsing"] }

[dev-dependencies]
serde_json = "=1.0.154"
